services:
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.123.0
    restart: unless-stopped
    user: "0:0"
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    volumes:
      - ./otel-collector-config.yaml:/etc/otelcol-contrib/config.yaml
      - otel_spans:/var/log/otel
    networks:
      - services_network
    depends_on:
      - tempo

  tempo:
    image: grafana/tempo:2.7.2
    restart: unless-stopped
    command: ["-config.file=/etc/tempo.yaml"]
    volumes:
      - ./tempo.yaml:/etc/tempo.yaml
      - tempo_data:/var/tempo
    networks:
      - services_network

  grafana:
    image: grafana/grafana:11.6.0
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_SERVER_ROOT_URL: "https://${GRAFANA_DOMAIN}"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning
      - grafana_data:/var/lib/grafana
    networks:
      - services_network
      - traefik
    depends_on:
      - tempo
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.${ROUTER_PREFIX}-grafana.rule=Host(`${GRAFANA_DOMAIN}`)"
      - "traefik.http.routers.${ROUTER_PREFIX}-grafana.entrypoints=websecure"
      - "traefik.http.routers.${ROUTER_PREFIX}-grafana.tls.certresolver=letsencrypt"
      - "traefik.http.services.${ROUTER_PREFIX}-grafana.loadbalancer.server.port=3000"

  prometheus:
    image: prom/prometheus:v3.3.1
    restart: unless-stopped
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'
      - '--web.enable-remote-write-receiver'
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    networks:
      - services_network
      - traefik
    depends_on:
      - otel-collector
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
      - "traefik.enable=true"
      - "traefik.http.routers.${ROUTER_PREFIX}-prometheus-rw.rule=Host(`${PROMETHEUS_DOMAIN}`) && PathPrefix(`/api/v1/write`)"
      - "traefik.http.routers.${ROUTER_PREFIX}-prometheus-rw.entrypoints=websecure"
      - "traefik.http.routers.${ROUTER_PREFIX}-prometheus-rw.tls.certresolver=letsencrypt"
      - "traefik.http.routers.${ROUTER_PREFIX}-prometheus-rw.middlewares=${ROUTER_PREFIX}-prometheus-auth"
      - "traefik.http.middlewares.${ROUTER_PREFIX}-prometheus-auth.basicauth.users=${PROMETHEUS_BASIC_AUTH_USERS}"
      - "traefik.http.services.${ROUTER_PREFIX}-prometheus-rw.loadbalancer.server.port=9090"

  watchtower:
    image: ghcr.io/nicholas-fedor/watchtower:latest
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    command: >
      --interval 60
      --label-enable
      --cleanup

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD} --appendonly yes
    env_file: .env
    volumes:
      - redis_data:/data
    networks:
      - db_network

  postgres:
    image: postgres:16
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - db_network

  mongo:
    image: mongo:7
    restart: unless-stopped
    env_file: .env
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD}
    volumes:
      - mongo_data:/data/db
    networks:
      - db_network

  user-db:
    image: ghcr.io/maichess/maichess-database-service:${DATABASE_SERVICE_TAG:-main}
    restart: unless-stopped
    depends_on:
      - postgres
      - otel-collector
    environment:
      ASPNETCORE_ENVIRONMENT: ${ENVIRONMENT}
      Database__Adapter: postgres
      Database__ConnectionString: "Host=postgres;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}"
      Database__ReadOnly: "false"
      Database__Migrations: "user"
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector:4317"
      OTEL_SERVICE_NAME: user-db
    networks:
      - db_network
      - services_network
    labels:
      - "com.centurylinklabs.watchtower.enable=true"

  user-db-ro:
    image: ghcr.io/maichess/maichess-database-service:${DATABASE_SERVICE_TAG:-main}
    restart: unless-stopped
    depends_on:
      - postgres
      - otel-collector
    environment:
      ASPNETCORE_ENVIRONMENT: ${ENVIRONMENT}
      Database__Adapter: postgres
      Database__ConnectionString: "Host=postgres;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}"
      Database__ReadOnly: "true"
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector:4317"
      OTEL_SERVICE_NAME: user-db-ro
    networks:
      - db_network
      - services_network
    labels:
      - "com.centurylinklabs.watchtower.enable=true"

  match-db:
    image: ghcr.io/maichess/maichess-database-service:${DATABASE_SERVICE_TAG:-main}
    restart: unless-stopped
    depends_on:
      - mongo
      - otel-collector
    environment:
      ASPNETCORE_ENVIRONMENT: ${ENVIRONMENT}
      Database__Adapter: mongo
      Database__ConnectionString: "mongodb://${MONGO_USER}:${MONGO_PASSWORD}@mongo:27017"
      Database__ReadOnly: "false"
      Database__Migrations: "match"
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector:4317"
      OTEL_SERVICE_NAME: match-db
    networks:
      - db_network
      - services_network
    labels:
      - "com.centurylinklabs.watchtower.enable=true"

  user-service:
    image: ghcr.io/maichess/maichess-user-service:${USER_SERVICE_TAG:-main}
    restart: unless-stopped
    depends_on:
      - user-db
      - otel-collector
    environment:
      ASPNETCORE_ENVIRONMENT: ${ENVIRONMENT}
      Services__DatabaseService: "http://user-db:8080"
      Jwt__Key: ${JWT_SECRET}
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector:4317"
    networks:
      - services_network
      - traefik
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
      - "traefik.enable=true"
      - "traefik.http.routers.${ROUTER_PREFIX}-users.rule=Host(`${USERS_DOMAIN}`)"
      - "traefik.http.routers.${ROUTER_PREFIX}-users.entrypoints=websecure"
      - "traefik.http.routers.${ROUTER_PREFIX}-users.tls.certresolver=letsencrypt"
      - "traefik.http.services.${ROUTER_PREFIX}-users.loadbalancer.server.port=8080"

  auth-service:
    image: ghcr.io/maichess/maichess-auth-service:${AUTH_SERVICE_TAG:-main}
    restart: unless-stopped
    depends_on:
      - redis
      - user-db-ro
      - user-service
      - otel-collector
    env_file: .env
    environment:
      NODE_ENV: ${ENVIRONMENT}
      JWT_SECRET: ${JWT_SECRET}
      REDIS_URL: "redis://:${REDIS_PASSWORD}@redis:6379"
      USER_SERVICE_GRPC_ADDR: user-service:8081
      USER_DB_SERVICE_GRPC_ADDR: user-db-ro:8080
      COOKIE_DOMAIN: ${COOKIE_DOMAIN:-}
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector:4317"
    networks:
      - db_network
      - services_network
      - traefik
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
      - "traefik.enable=true"
      - "traefik.http.routers.${ROUTER_PREFIX}-auth.rule=Host(`${AUTH_DOMAIN}`)"
      - "traefik.http.routers.${ROUTER_PREFIX}-auth.entrypoints=websecure"
      - "traefik.http.routers.${ROUTER_PREFIX}-auth.tls.certresolver=letsencrypt"
      - "traefik.http.services.${ROUTER_PREFIX}-auth.loadbalancer.server.port=3000"

  move-validator-service:
    image: ghcr.io/maichess/maichess-move-validator-service:${MOVE_VALIDATOR_SERVICE_TAG:-main}
    restart: unless-stopped
    depends_on:
      - otel-collector
    environment:
      GRPC_PORT: 50055
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector:4317"
    networks:
      - services_network
    labels:
      - "com.centurylinklabs.watchtower.enable=true"

  engine-service:
    image: ghcr.io/maichess/maichess-engine-service:${ENGINE_SERVICE_TAG:-main}
    restart: unless-stopped
    depends_on:
      - otel-collector
    environment:
      GRPC_PORT: 50056
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector:4317"
    networks:
      - services_network
    labels:
      - "com.centurylinklabs.watchtower.enable=true"

  socket-service:
    image: ghcr.io/maichess/maichess-socket-service:${SOCKET_SERVICE_TAG:-main}
    restart: unless-stopped
    depends_on:
      - auth-service
      - otel-collector
    environment:
      NODE_ENV: ${ENVIRONMENT}
      AUTH_SERVICE_GRPC_ADDR: "auth-service:50051"
      CORS_ORIGIN: ${CORS_ORIGIN:-*}
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector:4317"
    networks:
      - services_network
      - traefik
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
      - "traefik.enable=true"
      - "traefik.http.routers.${ROUTER_PREFIX}-sockets.rule=Host(`${SOCKETS_DOMAIN}`)"
      - "traefik.http.routers.${ROUTER_PREFIX}-sockets.entrypoints=websecure"
      - "traefik.http.routers.${ROUTER_PREFIX}-sockets.tls.certresolver=letsencrypt"
      - "traefik.http.services.${ROUTER_PREFIX}-sockets.loadbalancer.server.port=3000"

  match-maker-service:
    image: ghcr.io/maichess/maichess-match-maker-service:${MATCH_MAKER_SERVICE_TAG:-main}
    restart: unless-stopped
    depends_on:
      - redis
      - engine-service
      - socket-service
      - otel-collector
    environment:
      ASPNETCORE_ENVIRONMENT: ${ENVIRONMENT}
      ConnectionStrings__Redis: "redis:6379,password=${REDIS_PASSWORD}"
      MatchManager__Url: "http://match-manager-service:8081"
      Engine__Url: "http://engine-service:50056"
      Services__SocketService: "http://socket-service:50051"
      Jwt__Key: ${JWT_SECRET}
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector:4317"
    networks:
      - db_network
      - services_network
      - traefik
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
      - "traefik.enable=true"
      - "traefik.http.routers.${ROUTER_PREFIX}-matchmaker.rule=Host(`${MATCHMAKER_DOMAIN}`)"
      - "traefik.http.routers.${ROUTER_PREFIX}-matchmaker.entrypoints=websecure"
      - "traefik.http.routers.${ROUTER_PREFIX}-matchmaker.tls.certresolver=letsencrypt"
      - "traefik.http.services.${ROUTER_PREFIX}-matchmaker.loadbalancer.server.port=8080"

  match-manager-service:
    image: ghcr.io/maichess/maichess-match-manager-service:${MATCH_MANAGER_SERVICE_TAG:-main}
    restart: unless-stopped
    depends_on:
      - match-db
      - move-validator-service
      - engine-service
      - user-service
      - socket-service
      - otel-collector
    environment:
      ASPNETCORE_ENVIRONMENT: ${ENVIRONMENT}
      Services__DatabaseService: "http://match-db:8080"
      Services__MoveValidatorService: "http://move-validator-service:50055"
      Services__EngineService: "http://engine-service:50056"
      Services__UserService: "http://user-service:8081"
      Services__SocketService: "http://socket-service:50051"
      Jwt__Key: ${JWT_SECRET}
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector:4317"
    networks:
      - services_network
      - traefik
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
      - "traefik.enable=true"
      - "traefik.http.routers.${ROUTER_PREFIX}-matchmanager.rule=Host(`${MATCHMANAGER_DOMAIN}`)"
      - "traefik.http.routers.${ROUTER_PREFIX}-matchmanager.entrypoints=websecure"
      - "traefik.http.routers.${ROUTER_PREFIX}-matchmanager.tls.certresolver=letsencrypt"
      - "traefik.http.services.${ROUTER_PREFIX}-matchmanager.loadbalancer.server.port=8080"

  analysis-service:
    image: ghcr.io/maichess/maichess-analysis-service:${ANALYSIS_SERVICE_TAG:-main}
    restart: unless-stopped
    depends_on:
      - match-db
      - engine-service
      - move-validator-service
      - socket-service
      - otel-collector
    environment:
      ASPNETCORE_ENVIRONMENT: ${ENVIRONMENT}
      Services__DatabaseService: "http://match-db:8080"
      Services__EngineService: "http://engine-service:50056"
      Services__MoveValidatorService: "http://move-validator-service:50055"
      Services__SocketService: "http://socket-service:50051"
      Jwt__Key: ${JWT_SECRET}
      Analysis__DefaultBotId: "blitz"
      Analysis__DefaultLineCount: "3"
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector:4317"
    networks:
      - services_network
      - traefik
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
      - "traefik.enable=true"
      - "traefik.http.routers.${ROUTER_PREFIX}-analysis.rule=Host(`${ANALYSIS_DOMAIN}`)"
      - "traefik.http.routers.${ROUTER_PREFIX}-analysis.entrypoints=websecure"
      - "traefik.http.routers.${ROUTER_PREFIX}-analysis.tls.certresolver=letsencrypt"
      - "traefik.http.services.${ROUTER_PREFIX}-analysis.loadbalancer.server.port=8080"

  topology-service:
    image: ghcr.io/maichess/maichess-topology-service:${TOPOLOGY_SERVICE_TAG:-main}
    restart: unless-stopped
    depends_on:
      - otel-collector
    environment:
      NODE_ENV: ${ENVIRONMENT}
      SPANS_FILE: /var/log/otel/spans.jsonl
    volumes:
      - otel_spans:/var/log/otel
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - services_network
      - traefik
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
      - "traefik.enable=true"
      - "traefik.http.routers.${ROUTER_PREFIX}-topology-api.rule=Host(`${TOPOLOGY_API_DOMAIN}`)"
      - "traefik.http.routers.${ROUTER_PREFIX}-topology-api.entrypoints=websecure"
      - "traefik.http.routers.${ROUTER_PREFIX}-topology-api.tls.certresolver=letsencrypt"
      - "traefik.http.services.${ROUTER_PREFIX}-topology-api.loadbalancer.server.port=3001"

  topology-client:
    image: ghcr.io/maichess/maichess-topology-client:${TOPOLOGY_CLIENT_TAG:-main}
    restart: unless-stopped
    depends_on:
      - topology-service
    environment:
      NEXT_PUBLIC_TOPOLOGY_WS_URL: ${TOPOLOGY_WS_URL}
    networks:
      - services_network
      - traefik
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
      - "traefik.enable=true"
      - "traefik.http.routers.${ROUTER_PREFIX}-topology.rule=Host(`${TOPOLOGY_DOMAIN}`)"
      - "traefik.http.routers.${ROUTER_PREFIX}-topology.entrypoints=websecure"
      - "traefik.http.routers.${ROUTER_PREFIX}-topology.tls.certresolver=letsencrypt"
      - "traefik.http.services.${ROUTER_PREFIX}-topology.loadbalancer.server.port=3000"

  client:
    image: ghcr.io/maichess/maichess-client:${CLIENT_TAG:-main}
    restart: unless-stopped
    depends_on:
      - auth-service
      - user-service
      - match-maker-service
      - match-manager-service
      - socket-service
    environment:
      AUTH_SERVICE_URL: "http://auth-service:3000"
      USER_SERVICE_URL: "http://user-service:8080"
      MATCH_MAKER_URL: "http://match-maker-service:8080"
      MATCH_MANAGER_URL: "http://match-manager-service:8080"
      ANALYSIS_SERVICE_URL: "http://analysis-service:8080"
      # NEXT_PUBLIC_SOCKET_URL must be set at image build time — set this to the externally reachable socket-service URL
    networks:
      - services_network
      - traefik
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
      - "traefik.enable=true"
      - "traefik.http.routers.${ROUTER_PREFIX}-client.rule=Host(`${CLIENT_DOMAIN}`)"
      - "traefik.http.routers.${ROUTER_PREFIX}-client.entrypoints=websecure"
      - "traefik.http.routers.${ROUTER_PREFIX}-client.tls.certresolver=letsencrypt"
      - "traefik.http.services.${ROUTER_PREFIX}-client.loadbalancer.server.port=3000"


volumes:
  postgres_data:
  mongo_data:
  redis_data:
  tempo_data:
  grafana_data:
  prometheus_data:
  otel_spans:

networks:
  traefik:
    external: true
  services_network:
  db_network:
