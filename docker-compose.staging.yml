# Staging override — merge with base: docker compose -f docker-compose.yml -f docker-compose.staging.yml
#
# Architecture:
#   - Prod Traefik (owns :80/:443) does TCP passthrough for *.staging.* to staging Traefik
#   - Staging Traefik lives on the shared prod Docker network so prod Traefik can reach it,
#     but its Docker provider is constrained to only see maichess-staging project containers
#   - All staging services are on isolated networks (maichess-staging_*), invisible to prod Traefik
#   - Staging Traefik handles its own ACME certs (TLS-ALPN challenge works through the passthrough)
#
# Domain convention: X.staging.maichess.berger-software.com
#   (enables a single *.staging.* HostSNI wildcard in traefik-staging.yml)
#
# Volumes: run-staging.sh always runs `down -v` before `up`, ensuring ephemeral storage.

services:
  traefik:
    container_name: staging-maichess-traefik
    command:
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--providers.docker.constraints=Label(`com.docker.compose.project`,`maichess-staging`)"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.web.http.redirections.entrypoint.to=websecure"
      - "--entrypoints.web.http.redirections.entrypoint.scheme=https"
      - "--entrypoints.websecure.address=:443"
      - "--certificatesresolvers.letsencrypt.acme.tlschallenge=true"
      - "--certificatesresolvers.letsencrypt.acme.email=${ACME_EMAIL}"
      - "--certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json"
    # No host port bindings — traffic arrives exclusively via prod Traefik's TCP passthrough.
    networks:
      - services_network   # maichess-staging_services_network — discover staging services
      - prod_ingress        # services_network (prod) — reachable by prod Traefik for passthrough
    # Remove the file provider mount from base (not needed on staging Traefik)
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - letsencrypt:/letsencrypt

  otel-collector:
    container_name: staging-maichess-otel-collector

  tempo:
    container_name: staging-maichess-tempo

  grafana:
    container_name: staging-maichess-grafana
    environment:
      GF_SERVER_ROOT_URL: "https://grafana.staging.maichess.berger-software.com"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.grafana.rule=Host(`grafana.staging.maichess.berger-software.com`)"
      - "traefik.http.routers.grafana.entrypoints=websecure"
      - "traefik.http.routers.grafana.tls.certresolver=letsencrypt"
      - "traefik.http.services.grafana.loadbalancer.server.port=3000"

  watchtower:
    container_name: staging-watchtower

  redis:
    container_name: staging-maichess-redis

  postgres:
    container_name: staging-maichess-postgres

  mongo:
    container_name: staging-maichess-mongo

  user-db:
    container_name: staging-maichess-user-db

  user-db-ro:
    container_name: staging-maichess-user-db-ro

  match-db:
    container_name: staging-maichess-match-db

  user-service:
    container_name: staging-maichess-user-service
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.users.rule=Host(`users.staging.maichess.berger-software.com`)"
      - "traefik.http.routers.users.entrypoints=websecure"
      - "traefik.http.routers.users.tls.certresolver=letsencrypt"
      - "traefik.http.services.users.loadbalancer.server.port=8080"

  auth-service:
    container_name: staging-maichess-auth-service
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.auth.rule=Host(`auth.staging.maichess.berger-software.com`)"
      - "traefik.http.routers.auth.entrypoints=websecure"
      - "traefik.http.routers.auth.tls.certresolver=letsencrypt"
      - "traefik.http.services.auth.loadbalancer.server.port=3000"

  move-validator-service:
    container_name: staging-maichess-move-validator-service

  engine-service:
    container_name: staging-maichess-engine-service

  socket-service:
    container_name: staging-maichess-socket-service
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.sockets.rule=Host(`sockets.staging.maichess.berger-software.com`)"
      - "traefik.http.routers.sockets.entrypoints=websecure"
      - "traefik.http.routers.sockets.tls.certresolver=letsencrypt"
      - "traefik.http.services.sockets.loadbalancer.server.port=3000"

  match-maker-service:
    container_name: staging-maichess-match-maker-service
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.matchmaker.rule=Host(`matchmaker.staging.maichess.berger-software.com`)"
      - "traefik.http.routers.matchmaker.entrypoints=websecure"
      - "traefik.http.routers.matchmaker.tls.certresolver=letsencrypt"
      - "traefik.http.services.matchmaker.loadbalancer.server.port=8080"

  match-manager-service:
    container_name: staging-maichess-match-manager-service
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.matchmanager.rule=Host(`matchmanager.staging.maichess.berger-software.com`)"
      - "traefik.http.routers.matchmanager.entrypoints=websecure"
      - "traefik.http.routers.matchmanager.tls.certresolver=letsencrypt"
      - "traefik.http.services.matchmanager.loadbalancer.server.port=8080"

  analysis-service:
    container_name: staging-maichess-analysis-service
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.analysis.rule=Host(`analysis.staging.maichess.berger-software.com`)"
      - "traefik.http.routers.analysis.entrypoints=websecure"
      - "traefik.http.routers.analysis.tls.certresolver=letsencrypt"
      - "traefik.http.services.analysis.loadbalancer.server.port=8080"

  topology-service:
    container_name: staging-maichess-topology-service
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.topology-api.rule=Host(`api.topology.staging.maichess.berger-software.com`)"
      - "traefik.http.routers.topology-api.entrypoints=websecure"
      - "traefik.http.routers.topology-api.tls.certresolver=letsencrypt"
      - "traefik.http.services.topology-api.loadbalancer.server.port=3001"

  topology-client:
    container_name: staging-maichess-topology-client
    environment:
      NEXT_PUBLIC_TOPOLOGY_WS_URL: "wss://api.topology.staging.maichess.berger-software.com/ws"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.topology.rule=Host(`topology.staging.maichess.berger-software.com`)"
      - "traefik.http.routers.topology.entrypoints=websecure"
      - "traefik.http.routers.topology.tls.certresolver=letsencrypt"
      - "traefik.http.services.topology.loadbalancer.server.port=3000"

  client:
    container_name: staging-maichess-client
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.client.rule=Host(`staging.maichess.berger-software.com`)"
      - "traefik.http.routers.client.entrypoints=websecure"
      - "traefik.http.routers.client.tls.certresolver=letsencrypt"
      - "traefik.http.services.client.loadbalancer.server.port=3000"

networks:
  # Rename staging's internal networks so they're isolated from prod.
  # All staging services reference "services_network" / "db_network" in the base —
  # those names now resolve to these isolated Docker networks.
  services_network:
    name: maichess-staging_services_network
  db_network:
    name: maichess-staging_db_network
  # External reference to prod's services_network so prod Traefik can reach staging Traefik.
  prod_ingress:
    name: services_network
    external: true
