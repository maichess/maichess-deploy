      - "traefik.enable=true"
      - "traefik.http.routers.topology-api.rule=Host(`staging.api.topology.maichess.berger-software.com`)"
      - "traefik.http.routers.topology-api.entrypoints=websecure"
      - "traefik.http.routers.topology-api.tls.certresolver=letsencrypt"
      - "traefik.http.services.topology-api.loadbalancer.server.port=3001"

  topology-client:
    container_name: staging-maichess-topology-client
    environment:
      NEXT_PUBLIC_TOPOLOGY_WS_URL: "wss://staging.api.topology.maichess.berger-software.com/ws"
    labels:
      - "traefik.enable=true"
