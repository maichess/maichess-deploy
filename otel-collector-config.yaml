receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

exporters:
  otlp:
    endpoint: tempo:4317
    tls:
      insecure: true

  file:
    path: /var/log/otel/spans.jsonl
    rotation:
      max_megabytes: 100
      max_days: 1
      max_backups: 3

  prometheus:
    endpoint: "0.0.0.0:8889"

connectors:
  servicegraph:
    store:
      ttl: 2s
      max_items: 1000
    virtual_node_peer_attributes:
      - net.peer.name
      - server.address
      - rpc.service

processors:
  batch:
    timeout: 5s
    send_batch_size: 512

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlp, file, servicegraph]
    metrics/servicegraph:
      receivers: [servicegraph]
      exporters: [prometheus]
