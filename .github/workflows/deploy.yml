name: Deploy

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Deploy to k3s
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ vars.DROPLET_HOST }}
          username: ${{ vars.DROPLET_USER }}
          key: ${{ secrets.DROPLET_SSH_KEY }}
          port: 22
          script: |
            export KUBECONFIG=/etc/rancher/k3s/k3s.yaml
            cd maichess-deploy
            git pull

            cd helm/maichess
            helm dependency update .

            # Deploy production
            helm upgrade --install maichess . \
              -n maichess --create-namespace \
              -f values.yaml \
              -f values-prod.yaml \
              -f /etc/maichess/values-secrets-prod.yaml \
              --wait --timeout 5m
            kubectl rollout restart deployment -n maichess
            kubectl rollout status deployment -n maichess --timeout 5m

            # Deploy staging
            helm upgrade --install maichess-staging . \
              -n maichess-staging --create-namespace \
              -f values.yaml \
              -f values-staging.yaml \
              -f /etc/maichess/values-secrets-staging.yaml \
              --wait --timeout 5m
            kubectl rollout restart deployment -n maichess-staging
            kubectl rollout status deployment -n maichess-staging --timeout 5m
