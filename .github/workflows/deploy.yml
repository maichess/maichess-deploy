name: Deploy

on:
  push:
    branches:
      - main
    # Workflow-only changes never need a redeploy; avoids restarting prod when
    # CI/CD config changes.
    paths-ignore:
      - ".github/**"

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Deploy production to k3s
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ vars.DROPLET_HOST }}
          username: ${{ vars.DROPLET_USER }}
          key: ${{ secrets.DROPLET_SSH_KEY }}
          port: 22
          # appleboy/ssh-action defaults command_timeout to 10m; restarting all
          # deployments on one node needs more headroom.
          command_timeout: 40m
          script: |
            set -euo pipefail
            export KUBECONFIG=/etc/rancher/k3s/k3s.yaml
            restart_selector="maichess.io/container-update=true"

            # Retry transient chart-download failures (e.g. GitHub 504s).
            helm_dep_update() {
              for i in 1 2 3; do
                helm dependency update ./helm/maichess && return 0
                echo "helm dependency update failed (attempt $i/3); retrying in 10s..."
                sleep 10
              done
              echo "helm dependency update failed after 3 attempts"
              return 1
            }

            # Wait for a rollout, but abort within ~10s of an image-pull failure
            # instead of blocking the full --timeout. A missing/broken tag
            # otherwise hangs the deploy for 25m before failing.
            # $1=namespace $2=label selector
            rollout_failfast() {
              local namespace="$1" selector="$2"
              kubectl rollout status deployment -n "$namespace" -l "$selector" --timeout 25m &
              local pid=$!
              while kill -0 "$pid" 2>/dev/null; do
                local bad
                bad="$(kubectl get pods -n "$namespace" -l "$selector" \
                  -o jsonpath='{range .items[*]}{.metadata.name}{" -> "}{range .status.containerStatuses[*]}{.state.waiting.reason}{" ("}{.image}{")"}{end}{"\n"}{end}' 2>/dev/null \
                  | grep -Ei 'ImagePullBackOff|ErrImagePull|InvalidImageName' || true)"
                if [ -n "$bad" ]; then
                  echo "=== Image pull failing — aborting rollout early ==="
                  printf '%s\n' "$bad"
                  kill "$pid" 2>/dev/null || true
                  wait "$pid" 2>/dev/null || true
                  return 1
                fi
                sleep 10
              done
              wait "$pid"
            }

            cd maichess-deploy
            git fetch origin
            git checkout main
            git pull origin main

            helm_dep_update

            # Production tracks the `main` branch only. Staging is deployed
            # separately from `dev` via the Update Containers workflow.
            # No --wait + --no-hooks: helm always blocks on post-upgrade hooks
            # (e.g. the ES search-reindex Job), which would stall every push-to-
            # main deploy. Install-time bootstrap (replica set, topics, connectors,
            # reindex) is owned by helm/scripts/deploy-prod.sh (--wait + hooks);
            # here the rollout restart + status below is the single readiness gate.
            helm upgrade --install maichess ./helm/maichess \
              -n maichess --create-namespace \
              -f ./helm/maichess/values.yaml \
              -f ./helm/maichess/values-prod.yaml \
              -f /etc/maichess/values-secrets-prod.yaml \
              --no-hooks \
              --timeout 10m
            kubectl rollout restart deployment -n maichess -l "$restart_selector"
            if ! rollout_failfast maichess "$restart_selector"; then
              echo "=== Rollout failed; deployment status ==="
              kubectl get deployment -n maichess -l "$restart_selector" -o wide
              echo "=== Pods for container-update deployments ==="
              kubectl get pod -n maichess -l "$restart_selector" -o wide
              echo "=== Non-ready / terminating pod details ==="
              kubectl describe pod -n maichess -l "$restart_selector"
              echo "=== Recent namespace events ==="
              kubectl get events -n maichess --sort-by=.lastTimestamp
              exit 1
            fi
