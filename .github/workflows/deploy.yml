name: Deploy

on:
  push:
    branches:
      - main
    # Workflow-only changes never need a redeploy; avoids restarting prod when
    # CI/CD config changes.
    paths-ignore:
      - ".github/**"

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Deploy production to k3s
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ vars.DROPLET_HOST }}
          username: ${{ vars.DROPLET_USER }}
          key: ${{ secrets.DROPLET_SSH_KEY }}
          port: 22
          # appleboy/ssh-action defaults command_timeout to 10m; restarting all
          # deployments on one node needs more headroom.
          command_timeout: 40m
          script: |
            set -euo pipefail
            export KUBECONFIG=/etc/rancher/k3s/k3s.yaml
            restart_selector="maichess.io/container-update=true"

            # Retry transient chart-download failures (e.g. GitHub 504s).
            helm_dep_update() {
              for i in 1 2 3; do
                helm dependency update ./helm/maichess && return 0
                echo "helm dependency update failed (attempt $i/3); retrying in 10s..."
                sleep 10
              done
              echo "helm dependency update failed after 3 attempts"
              return 1
            }

            cd maichess-deploy
            git fetch origin
            git checkout main
            git pull origin main

            helm_dep_update

            # Production tracks the `main` branch only. Staging is deployed
            # separately from `dev` via the Update Containers workflow.
            # No --wait: the rollout restart + rollout status below is the single
            # readiness gate, so we don't wait for the whole release twice.
            helm upgrade --install maichess ./helm/maichess \
              -n maichess --create-namespace \
              -f ./helm/maichess/values.yaml \
              -f ./helm/maichess/values-prod.yaml \
              -f /etc/maichess/values-secrets-prod.yaml \
              --timeout 10m
            kubectl rollout restart deployment -n maichess -l "$restart_selector"
            if ! kubectl rollout status deployment -n maichess -l "$restart_selector" --timeout 25m; then
              echo "=== Rollout failed; deployment status ==="
              kubectl get deployment -n maichess -l "$restart_selector" -o wide
              echo "=== Pods for container-update deployments ==="
              kubectl get pod -n maichess -l "$restart_selector" -o wide
              echo "=== Non-ready / terminating pod details ==="
              kubectl describe pod -n maichess -l "$restart_selector"
              echo "=== Recent namespace events ==="
              kubectl get events -n maichess --sort-by=.lastTimestamp
              exit 1
            fi
