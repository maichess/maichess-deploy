name: Update Containers

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Which environment to update
        required: true
        default: staging
        type: choice
        options:
          - both
          - prod
          - staging
      reindex:
        description: >-
          Rebuild the Elasticsearch search index. Launches the rebuild as a
          DETACHED background Job after the rollout (the pipeline does NOT wait
          for it to finish); leave off for routine tag updates.
        required: false
        default: false
        type: boolean
      wipe_data:
        description: >-
          DESTRUCTIVE — wipe ALL stateful data for a completely fresh
          environment (drops every Mongo collection, FLUSHALL Redis, resets the
          Kafka app topics, drops + rebuilds the Elasticsearch indexes) AFTER the
          chart is deployed. Intended for staging. To wipe prod you MUST also set
          confirm_prod_wipe (see below); otherwise prod is never touched.
        required: false
        default: false
        type: boolean
      confirm_prod_wipe:
        description: >-
          Prod safety interlock. wipe_data only affects PRODUCTION when this is
          set to exactly WIPE-PROD-DATA. Leave blank for staging-only wipes.
        required: false
        default: ""
        type: string

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Update containers on k3s
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ vars.DROPLET_HOST }}
          username: ${{ vars.DROPLET_USER }}
          key: ${{ secrets.DROPLET_SSH_KEY }}
          port: 22
          # appleboy/ssh-action defaults command_timeout to 10m; restarting all
          # deployments on one node needs more headroom.
          command_timeout: 40m
          script: |
            set -euo pipefail
            export KUBECONFIG=/etc/rancher/k3s/k3s.yaml

            # Retry transient chart-download failures (e.g. GitHub 504s).
            helm_dep_update() {
              for i in 1 2 3; do
                helm dependency update ./helm/maichess && return 0
                echo "helm dependency update failed (attempt $i/3); retrying in 10s..."
                sleep 10
              done
              echo "helm dependency update failed after 3 attempts"
              return 1
            }

            # Wait for a rollout, but abort within ~10s of an image-pull failure
            # instead of blocking the full --timeout. A missing/broken tag (e.g.
            # an image that was never published) otherwise hangs the run for 25m
            # before failing — the opposite of "reliable, frequent tag updates".
            # $1=namespace $2=label selector
            rollout_failfast() {
              local namespace="$1" selector="$2"
              kubectl rollout status deployment -n "$namespace" -l "$selector" --timeout 25m &
              local pid=$!
              while kill -0 "$pid" 2>/dev/null; do
                local bad
                bad="$(kubectl get pods -n "$namespace" -l "$selector" \
                  -o jsonpath='{range .items[*]}{.metadata.name}{" -> "}{range .status.containerStatuses[*]}{.state.waiting.reason}{" ("}{.image}{")"}{end}{"\n"}{end}' 2>/dev/null \
                  | grep -Ei 'ImagePullBackOff|ErrImagePull|InvalidImageName' || true)"
                if [ -n "$bad" ]; then
                  echo "=== Image pull failing — aborting rollout early ==="
                  printf '%s\n' "$bad"
                  kill "$pid" 2>/dev/null || true
                  wait "$pid" 2>/dev/null || true
                  return 1
                fi
                sleep 10
              done
              wait "$pid"
            }

            # Routine tag updates must not block on bootstrap/reindex hooks.
            # helm ALWAYS waits for post-install/post-upgrade hooks (regardless of
            # --wait), so the replica-set init, topic creation, connector
            # registration and ES reindex Jobs gate (and can stall) every upgrade.
            # Those are install-time concerns owned by helm/scripts/deploy-*.sh
            # (run with --wait + hooks). Here --no-hooks keeps tag rollouts fast
            # and reliable; the rollout status below is the single readiness gate.
            HOOK_ARGS="--no-hooks"

            # ES reindex is requested via the `reindex` input. We deliberately do
            # NOT enable the blocking search-reindex helm hook (a full rebuild
            # overruns `helm --timeout` and fails the pipeline). Instead we deploy
            # with --no-hooks and, after the rollout, launch the rebuild as a
            # DETACHED Job via maintenance.sh — it keeps running after the
            # pipeline returns. See reindex_env() below.
            REINDEX="${{ inputs.reindex }}"

            # --- Data-wipe toggle -------------------------------------------
            # When wipe_data=true, reuse the supported operator tool
            # (helm/scripts/maintenance.sh reset-data) to clear every store so the
            # environment comes up on a clean slate. It is run AFTER the chart is
            # deployed, so the freshly rolled-out images initialise against empty
            # stores. The full wipe covers Mongo + Redis + Kafka + Elasticsearch.
            WIPE_DATA="${{ inputs.wipe_data }}"
            WIPE_PROD=0
            if [[ "$WIPE_DATA" == "true" ]]; then
              # Hard interlock: production data is only wiped with an explicit
              # typed confirmation, even when environment is "prod" or "both".
              if [[ "${{ inputs.confirm_prod_wipe }}" == "WIPE-PROD-DATA" ]]; then
                WIPE_PROD=1
              fi
              if [[ ( "${{ inputs.environment }}" == "prod" || "${{ inputs.environment }}" == "both" ) && "$WIPE_PROD" -ne 1 ]]; then
                echo "Refusing to wipe PRODUCTION data: set confirm_prod_wipe=WIPE-PROD-DATA to allow it."
                echo "(Staging will still be wiped if it is part of this run.)"
              fi
            fi

            # wipe_env <human-label> [maintenance.sh namespace flags...]
            # A full reset also drops + rebuilds the (now empty) ES indexes, so it
            # completes near-instantly and subsumes any reindex for that env.
            wipe_env() {
              local label="$1"; shift
              echo "=== WIPING ALL DATA ($label): Mongo + Redis + Kafka + Elasticsearch ==="
              bash ./helm/scripts/maintenance.sh reset-data --with-kafka --yes "$@"
            }

            # reindex_env <human-label> [maintenance.sh namespace flags...]
            # Drops the ES indexes and launches a DETACHED rebuild Job (no --wait),
            # so the rebuild outlives this pipeline instead of stalling it.
            reindex_env() {
              local label="$1"; shift
              echo "=== Launching DETACHED Elasticsearch rebuild ($label) ==="
              bash ./helm/scripts/maintenance.sh rebuild-search "$@"
            }

            deploy_env() {
              local release="$1" namespace="$2" values="$3" secrets="$4"
              local restart_selector="maichess.io/container-update=true"
              helm_dep_update
              echo "=== helm upgrade $release (hooks: ${HOOK_ARGS:-enabled}) ==="
              helm upgrade --install "$release" ./helm/maichess \
                -n "$namespace" --create-namespace \
                -f ./helm/maichess/values.yaml \
                -f "$values" \
                -f "$secrets" \
                $HOOK_ARGS \
                --timeout 10m
              echo "=== rollout restart + status ($namespace) ==="
              kubectl rollout restart deployment -n "$namespace" -l "$restart_selector"
              if ! rollout_failfast "$namespace" "$restart_selector"; then
                echo "=== Rollout failed; deployment status ==="
                kubectl get deployment -n "$namespace" -l "$restart_selector" -o wide
                echo "=== Pods for container-update deployments ==="
                kubectl get pod -n "$namespace" -l "$restart_selector" -o wide
                echo "=== Non-ready / terminating pod details ==="
                kubectl describe pod -n "$namespace" -l "$restart_selector"
                echo "=== Recent namespace events ==="
                kubectl get events -n "$namespace" --sort-by=.lastTimestamp
                return 1
              fi
            }

            cd maichess-deploy
            git fetch origin

            if [[ "${{ inputs.environment }}" == "prod" || "${{ inputs.environment }}" == "both" ]]; then
              echo "=== Updating production (main) ==="
              git checkout main
              git pull origin main
              deploy_env maichess maichess ./helm/maichess/values-prod.yaml /etc/maichess/values-secrets-prod.yaml
              if [[ "$WIPE_DATA" == "true" && "$WIPE_PROD" -eq 1 ]]; then
                wipe_env production   # default namespace is maichess (prod); rebuilds ES too
              elif [[ "$REINDEX" == "true" ]]; then
                reindex_env production
              fi
            fi

            if [[ "${{ inputs.environment }}" == "staging" || "${{ inputs.environment }}" == "both" ]]; then
              echo "=== Updating staging (dev) ==="
              git checkout dev
              git pull origin dev
              deploy_env maichess-staging maichess-staging ./helm/maichess/values-staging.yaml /etc/maichess/values-secrets-staging.yaml
              if [[ "$WIPE_DATA" == "true" ]]; then
                wipe_env staging --staging   # rebuilds ES too
              elif [[ "$REINDEX" == "true" ]]; then
                reindex_env staging --staging
              fi
            fi

            # Leave the working copy on main so the auto-deploy workflow is consistent.
            git checkout main
