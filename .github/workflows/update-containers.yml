name: Update Containers

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Which environment to update
        required: true
        default: staging
        type: choice
        options:
          - both
          - prod
          - staging

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Update containers on k3s
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ vars.DROPLET_HOST }}
          username: ${{ vars.DROPLET_USER }}
          key: ${{ secrets.DROPLET_SSH_KEY }}
          port: 22
          script: |
            set -euo pipefail
            export KUBECONFIG=/etc/rancher/k3s/k3s.yaml

            # Retry transient chart-download failures (e.g. GitHub 504s).
            helm_dep_update() {
              for i in 1 2 3; do
                helm dependency update ./helm/maichess && return 0
                echo "helm dependency update failed (attempt $i/3); retrying in 10s..."
                sleep 10
              done
              echo "helm dependency update failed after 3 attempts"
              return 1
            }

            cd maichess-deploy
            git fetch origin

            if [[ "${{ inputs.environment }}" == "prod" || "${{ inputs.environment }}" == "both" ]]; then
              echo "=== Updating production (main) ==="
              git checkout main
              git pull origin main
              helm_dep_update
              helm upgrade --install maichess ./helm/maichess \
                -n maichess --create-namespace \
                -f ./helm/maichess/values.yaml \
                -f ./helm/maichess/values-prod.yaml \
                -f /etc/maichess/values-secrets-prod.yaml \
                --wait --timeout 10m
              kubectl rollout restart deployment -n maichess
              kubectl rollout status deployment -n maichess --timeout 10m
            fi

            if [[ "${{ inputs.environment }}" == "staging" || "${{ inputs.environment }}" == "both" ]]; then
              echo "=== Updating staging (dev) ==="
              git checkout dev
              git pull origin dev
              helm_dep_update
              helm upgrade --install maichess-staging ./helm/maichess \
                -n maichess-staging --create-namespace \
                -f ./helm/maichess/values.yaml \
                -f ./helm/maichess/values-staging.yaml \
                -f /etc/maichess/values-secrets-staging.yaml \
                --wait --timeout 10m
              kubectl rollout restart deployment -n maichess-staging
              kubectl rollout status deployment -n maichess-staging --timeout 10m
            fi

            # Leave the working copy on main so the auto-deploy workflow is consistent.
            git checkout main
