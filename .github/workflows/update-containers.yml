name: Update Containers

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Which environment to update
        required: true
        default: staging
        type: choice
        options:
          - both
          - prod
          - staging

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Update containers on k3s
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ vars.DROPLET_HOST }}
          username: ${{ vars.DROPLET_USER }}
          key: ${{ secrets.DROPLET_SSH_KEY }}
          port: 22
          # appleboy/ssh-action defaults command_timeout to 10m; restarting all
          # deployments on one node needs more headroom.
          command_timeout: 40m
          script: |
            set -euo pipefail
            export KUBECONFIG=/etc/rancher/k3s/k3s.yaml

            # Retry transient chart-download failures (e.g. GitHub 504s).
            helm_dep_update() {
              for i in 1 2 3; do
                helm dependency update ./helm/maichess && return 0
                echo "helm dependency update failed (attempt $i/3); retrying in 10s..."
                sleep 10
              done
              echo "helm dependency update failed after 3 attempts"
              return 1
            }

            # No --wait on helm: rollout restart + rollout status is the single
            # readiness gate, so we don't wait for the release twice.
            deploy_env() {
              local release="$1" namespace="$2" values="$3" secrets="$4"
              local restart_selector="maichess.io/container-update=true"
              helm_dep_update
              helm upgrade --install "$release" ./helm/maichess \
                -n "$namespace" --create-namespace \
                -f ./helm/maichess/values.yaml \
                -f "$values" \
                -f "$secrets" \
                --timeout 10m
              kubectl rollout restart deployment -n "$namespace" -l "$restart_selector"
              if ! kubectl rollout status deployment -n "$namespace" -l "$restart_selector" --timeout 25m; then
                echo "=== Rollout failed; deployment status ==="
                kubectl get deployment -n "$namespace" -l "$restart_selector" -o wide
                echo "=== Pods for container-update deployments ==="
                kubectl get pod -n "$namespace" -l "$restart_selector" -o wide
                echo "=== Non-ready / terminating pod details ==="
                kubectl describe pod -n "$namespace" -l "$restart_selector"
                echo "=== Recent namespace events ==="
                kubectl get events -n "$namespace" --sort-by=.lastTimestamp
                return 1
              fi
            }

            cd maichess-deploy
            git fetch origin

            if [[ "${{ inputs.environment }}" == "prod" || "${{ inputs.environment }}" == "both" ]]; then
              echo "=== Updating production (main) ==="
              git checkout main
              git pull origin main
              deploy_env maichess maichess ./helm/maichess/values-prod.yaml /etc/maichess/values-secrets-prod.yaml
            fi

            if [[ "${{ inputs.environment }}" == "staging" || "${{ inputs.environment }}" == "both" ]]; then
              echo "=== Updating staging (dev) ==="
              git checkout dev
              git pull origin dev
              deploy_env maichess-staging maichess-staging ./helm/maichess/values-staging.yaml /etc/maichess/values-secrets-staging.yaml
            fi

            # Leave the working copy on main so the auto-deploy workflow is consistent.
            git checkout main
