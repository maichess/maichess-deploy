apiVersion: v2
name: maichess
description: MaiChess microservice platform
type: application
version: 0.1.0
appVersion: "1.0.0"

dependencies:
  # --- Observability ---
  - name: grafana
    version: "~8.8"
    repository: https://grafana.github.io/helm-charts
    alias: grafana
  - name: tempo
    version: "~1.15"
    repository: https://grafana.github.io/helm-charts
    alias: tempo
  - name: prometheus
    version: "~27.5"
    repository: https://prometheus-community.github.io/helm-charts
    alias: prometheus
  - name: opentelemetry-collector
    version: "~0.115"
    repository: https://open-telemetry.github.io/opentelemetry-helm-charts
    alias: otelCollector
  # --- Insights / Spark ---
  # Kubeflow Spark Operator: reconciles SparkApplication / ScheduledSparkApplication
  # CRDs into driver/executor pods. Gated to staging (insights program). Configured
  # under the `sparkOperator` values key (node-pinned to maichess-mega, low priority).
  - name: spark-operator
    version: "2.1.1"
    repository: https://kubeflow.github.io/spark-operator
    alias: sparkOperator
    condition: sparkOperator.enabled
