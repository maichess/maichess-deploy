# =============================================================================
# Global
# =============================================================================
global:
  imagePullPolicy: Always
  environment: Production  # overridden in values-staging.yaml

# Custom image registry for maichess services (NOT under global, so subcharts don't inherit it)
maichess:
  imageRegistry: ghcr.io/maichess

# =============================================================================
# Secrets (override via values-secrets-*.yaml on the server, NOT committed to git)
# =============================================================================
secrets:
  jwtSecret: "CHANGE_ME"
  cookieDomain: "maichess.berger-software.com"
  corsOrigin: "https://maichess.berger-software.com"
  postgresPassword: "CHANGE_ME"
  mongoPassword: "CHANGE_ME"
  redisPassword: "CHANGE_ME"
  # Mongo replica-set internal-auth keyfile (only used when kafkaConnect.enabled).
  # Same content on every member, 6–1024 chars; override with random base64 in prod.
  mongoKeyfile: "CHANGE_ME_REPLACE_WITH_RANDOM_BASE64_KEYFILE"
  grafanaAdminPassword: "CHANGE_ME"
  prometheusBasicAuthUsers: "CHANGE_ME"
  topologyWsUrl: "wss://api.topology.maichess.berger-software.com/ws"
  # Standalone tournament-server JWT signing key — not related to maichess auth.
  tournamentJwtSecret: "CHANGE_ME"

# =============================================================================
# Ingress (all external-facing domains)
# =============================================================================
ingress:
  enabled: true
  clientDomain: maichess.berger-software.com
  usersDomain: users.maichess.berger-software.com
  authDomain: auth.maichess.berger-software.com
  socketsDomain: sockets.maichess.berger-software.com
  matchmakerDomain: matchmaker.maichess.berger-software.com
  matchmanagerDomain: matchmanager.maichess.berger-software.com
  analysisDomain: analysis.maichess.berger-software.com
  arenaDomain: bot-arena.maichess.berger-software.com
  grafanaDomain: grafana.maichess.berger-software.com
  prometheusDomain: prometheus.maichess.berger-software.com
  topologyApiDomain: api.topology.maichess.berger-software.com
  topologyDomain: topology.maichess.berger-software.com
  tournamentDomain: tournament.maichess.berger-software.com
  tournamentBridgeDomain: tournament-bridge.maichess.berger-software.com

certManager:
  email: admin@berger-software.com

# =============================================================================
# Application Services
# =============================================================================
services:
  client:
    tag: main
    env:
      - name: AUTH_SERVICE_URL
        value: "http://auth-service:3000"
      - name: USER_SERVICE_URL
        value: "http://user-service:8080"
      - name: MATCH_MAKER_URL
        value: "http://match-maker-service:8080"
      - name: MATCH_MANAGER_URL
        value: "http://match-manager-service:8080"
      - name: ANALYSIS_SERVICE_URL
        value: "http://analysis-service:8080"
      - name: BOT_ARENA_URL
        value: "http://bot-arena-service:8080"
      - name: TOURNAMENT_BRIDGE_URL
        value: "http://tournament-bridge-service:8080"
      - name: SEARCH_SERVICE_URL
        value: "http://search-service:8080"
      - name: ANTICHEAT_SERVICE_URL
        value: "http://anticheat-service:8080"

  userService:
    tag: main
    env:
      - name: ASPNETCORE_ENVIRONMENT
        value: "$(ENVIRONMENT)"
      - name: Services__DatabaseService
        value: "http://user-db:8080"
      - name: OTEL_SERVICE_NAME
        value: user-service

  authService:
    tag: main
    resources:
      requests:
        cpu: 150m
        memory: 256Mi
      limits:
        cpu: 500m
        memory: 512Mi
    autoscaling:
      enabled: false
    env:
      - name: NODE_ENV
        value: "$(ENVIRONMENT)"
      - name: USER_SERVICE_GRPC_ADDR
        value: "user-service:8081"
      - name: USER_DB_SERVICE_GRPC_ADDR
        value: "user-db-ro:8080"
      - name: UV_THREADPOOL_SIZE
        value: "16"
      - name: OTEL_SERVICE_NAME
        value: auth-service

  socketService:
    tag: main
    env:
      - name: NODE_ENV
        value: "$(ENVIRONMENT)"
      - name: AUTH_SERVICE_GRPC_ADDR
        value: "auth-service:50051"
      - name: OTEL_SERVICE_NAME
        value: socket-service

  matchMakerService:
    tag: main
    resources:
      requests:
        cpu: 150m
        memory: 256Mi
      limits:
        cpu: 500m
        memory: 512Mi
    autoscaling:
      enabled: false
    env:
      - name: ASPNETCORE_ENVIRONMENT
        value: "$(ENVIRONMENT)"
      - name: MatchManager__Url
        value: "http://match-manager-service:8081"
      - name: Engine__Url
        value: "http://engine-service:50056"
      - name: Services__SocketService
        value: "http://socket-service:50051"
      - name: OTEL_SERVICE_NAME
        value: match-maker-service

  matchManagerService:
    tag: main
    env:
      - name: ASPNETCORE_ENVIRONMENT
        value: "$(ENVIRONMENT)"
      # Real-time socket fan-out stays on the proven gRPC path (Socket.BroadcastMatchEvent)
      # until the Kafka move loop (Phase 3) lands. The socket.outbound.v1 producer is wired
      # but the Kafka hop is not yet verified end-to-end; routing only the fan-out through
      # Kafka adds a failure surface with no benefit while the move pipeline is still gRPC.
      # Flip to "kafka" once socket.outbound consume/produce is confirmed in staging.
      - name: Socket__Transport
        value: "grpc"
      - name: Services__DatabaseService
        value: "http://match-db:8080"
      - name: Services__MoveValidatorService
        value: "http://move-validator-service:50055"
      - name: Services__EngineService
        value: "http://engine-service:50056"
      - name: Services__UserService
        value: "http://user-service:8081"
      - name: Services__SocketService
        value: "http://socket-service:50051"
      # Real-time fan-out goes over Kafka (socket.outbound.v1, Protobuf). The prior
      # grpc revert (the socket caveat) is resolved — Kafka task 02.
      - name: Socket__Transport
        value: "kafka"
      - name: OTEL_SERVICE_NAME
        value: match-manager-service

  analysisService:
    tag: main
    resources:
      requests:
        cpu: 200m
        memory: 256Mi
      limits:
        cpu: "1"
        memory: 512Mi
    autoscaling:
      enabled: false
    env:
      - name: ASPNETCORE_ENVIRONMENT
        value: "$(ENVIRONMENT)"
      - name: Services__DatabaseService
        value: "http://match-db:8080"
      - name: Services__EngineService
        value: "http://engine-service:50056"
      - name: Services__MoveValidatorService
        value: "http://move-validator-service:50055"
      - name: Services__SocketService
        value: "http://socket-service:50051"
      - name: Services__UserService
        value: "http://user-service:8081"
      - name: Analysis__DefaultBotId
        value: "blitz"
      - name: Analysis__DefaultLineCount
        value: "3"
      - name: OTEL_SERVICE_NAME
        value: analysis-service

  moveValidatorService:
    tag: main
    resources:
      requests:
        cpu: 100m
        memory: 64Mi
      limits:
        cpu: 500m
        memory: 128Mi
    autoscaling:
      enabled: false
    env:
      - name: GRPC_PORT
        value: "50055"
      - name: OTEL_SERVICE_NAME
        value: move-validator-service

  engineService:
    tag: main
    resources:
      requests:
        cpu: 200m
        memory: 512Mi
      limits:
        cpu: "1"
        memory: 1Gi
    autoscaling:
      enabled: false
    env:
      - name: JAVA_TOOL_OPTIONS
        value: "-XX:MaxRAMPercentage=75.0"
      - name: GRPC_PORT
        value: "50056"
      - name: OTEL_SERVICE_NAME
        value: engine-service

  botArenaService:
    tag: main
    resources:
      requests:
        cpu: 150m
        memory: 256Mi
      limits:
        cpu: 500m
        memory: 512Mi
    autoscaling:
      enabled: false
    env:
      - name: ASPNETCORE_ENVIRONMENT
        value: "$(ENVIRONMENT)"
      - name: Services__DatabaseService
        value: "http://arena-db:8080"
      - name: Services__MatchManager
        value: "http://match-manager-service:8081"
      - name: Services__Engine
        value: "http://engine-service:50056"
      - name: Services__MatchMaker
        value: "http://match-maker-service:8080"
      - name: OTEL_SERVICE_NAME
        value: bot-arena-service

  databaseService:
    tag: main

  # maichess-search-service (feature-prompts/13). Disabled until the repo/image
  # exists; flip enabled=true (and elasticsearch.enabled / kafkaConnect.enabled).
  searchService:
    enabled: false
    tag: main
    # Run the reindex/backfill Job (post-install/upgrade hook) that rebuilds every
    # ES index from Mongo. Set true on first rollout or for an on-demand full rebuild.
    reindex: false
    resources:
      requests:
        cpu: 150m
        memory: 256Mi
      limits:
        cpu: 500m
        memory: 512Mi
    env:
      - name: ASPNETCORE_ENVIRONMENT
        value: "$(ENVIRONMENT)"
      - name: Elasticsearch__Url
        value: "http://elasticsearch:9200"
      - name: Services__DatabaseService
        value: "http://match-db:8080"
      - name: OTEL_SERVICE_NAME
        value: search-service

  # maichess-anticheat-service (feature-prompts/14). Disabled until the repo/image
  # and the database-service "anticheat" migration set exist.
  antiCheatService:
    enabled: false
    tag: main
    resources:
      requests:
        cpu: 200m
        memory: 256Mi
      limits:
        cpu: "1"
        memory: 512Mi
    env:
      - name: ASPNETCORE_ENVIRONMENT
        value: "$(ENVIRONMENT)"
      - name: Services__AnticheatDatabase
        value: "http://anticheat-db:8080"
      - name: Services__MatchDatabase
        value: "http://match-db:8080"
      - name: Services__EngineService
        value: "http://engine-service:50056"
      - name: Services__UserService
        value: "http://user-service:8081"
      - name: OTEL_SERVICE_NAME
        value: anticheat-service

  topologyService:
    tag: main
    env:
      - name: SPANS_FILE
        value: "/var/log/otel/spans.jsonl"
      - name: OTEL_SERVICE_NAME
        value: topology-service

  topologyClient:
    tag: main

  tournamentBridgeService:
    tag: main
    env:
      - name: Services__MatchManagerService
        value: "http://match-manager-service:8081"
      - name: Services__EngineService
        value: "http://engine-service:50056"
      - name: TournamentServer__DefaultUrl
        value: "http://tournament-server:8080"
      - name: OTEL_SERVICE_NAME
        value: tournament-bridge-service

  # Standalone tournament server (not part of the maichess microservice stack).
  # Disabled by default; enabled in values-prod.yaml.
  tournamentServer:
    enabled: false
    tag: main

# =============================================================================
# Kafka event bus + Schema Registry (event-driven architecture)
# Templates: kafka.yaml, schema-registry.yaml, kafka-topics-init.yaml, kafka-ui.yaml
# See maichess-knowledge-base/event-driven-architecture.md
# =============================================================================
kafka:
  # Disabled by default so prod is not affected during the event-driven rollout.
  # Enabled in values-staging.yaml; flip on for prod once the migration is ready.
  enabled: false
  image: apache/kafka:3.9.0
  # Fixed KRaft cluster id (22-char url-safe base64); keep stable across upgrades.
  clusterId: MkU3OEVBNTcwNTJENDM2Qg
  bootstrap: "kafka:9092"
  # Single-broker setup (replicas hardcoded to 1 in kafka.yaml). A multi-broker
  # cluster (RF=3) needs the StatefulSet to scale replicas + expand the KRaft
  # controller quorum voter list — out of scope for Phase 0.
  replicationFactor: 1
  storage: 8Gi
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: "1"
      memory: 1Gi
  ui:
    enabled: false        # flip on for demos; exposes provectuslabs/kafka-ui
    image: provectuslabs/kafka-ui:latest
  # Topic catalogue — created idempotently by the kafka-topics-init Job.
  # Mirrors the topic table in the event-driven-architecture ADR.
  # retentionMs is quoted so large values are not coerced to float (scientific
  # notation) — kafka-topics.sh needs a plain integer string.
  topics:
    - name: match.commands.v1
      partitions: 12
      retentionMs: "86400000"      # 24h
      cleanupPolicy: delete
    - name: match.events.v1
      partitions: 12
      retentionMs: "-1"            # infinite — the event log / source of truth
      cleanupPolicy: delete
    - name: matchmaking.commands.v1
      partitions: 3
      retentionMs: "3600000"       # 1h
      cleanupPolicy: delete
    # matchmaking.events.v1 must share partition count with user.events.v1 (both 3) so
    # the Match Maker KTable join co-partitions (matchmaking keyed by playerId joins
    # user.events keyed by userId). See feature-prompts/11.
    - name: matchmaking.events.v1
      partitions: 3
      retentionMs: "604800000"     # 7d
      cleanupPolicy: delete
    # Output of the Match Maker co-partitioned stream-table join (PlayerEnqueued tagged
    # with the live KTable rating). Derived/rebuildable; bounded retention.
    - name: matchmaking.skill.v1
      partitions: 3
      retentionMs: "604800000"     # 7d
      cleanupPolicy: delete
    # Changelog for the Streamiz user-ratings KTable RocksDb store (application.id +
    # store name). Compacted: the durable backing the KTable restores from on a Match
    # Maker restart. See feature-prompts/11.
    - name: match-maker-user-ratings-user-ratings-store-changelog
      partitions: 3
      retentionMs: "-1"
      cleanupPolicy: compact
    - name: analysis.commands.v1
      partitions: 3
      retentionMs: "3600000"       # 1h
      cleanupPolicy: delete
    - name: analysis.events.v1
      partitions: 3
      retentionMs: "604800000"     # 7d
      cleanupPolicy: delete
    - name: user.events.v1
      partitions: 3
      retentionMs: "-1"
      cleanupPolicy: compact
    - name: socket.outbound.v1
      partitions: 3
      retentionMs: "3600000"       # 1h
      cleanupPolicy: delete
    # Anti-cheat flag propagation (feature-prompts/14). Compacted: latest flag
    # state per user, consumed by the user read models / Match Maker.
    - name: cheat.events.v1
      partitions: 3
      retentionMs: "-1"
      cleanupPolicy: compact
    # CDC raw change streams (feature-prompts/10, /13). Internal — not a consumer
    # contract. Bounded retention; the curated user.events / ES indexer read these.
    - name: user.cdc.v1
      partitions: 3
      retentionMs: "604800000"     # 7d
      cleanupPolicy: delete
    - name: match.cdc.v1
      partitions: 3
      retentionMs: "604800000"     # 7d
      cleanupPolicy: delete

schemaRegistry:
  image: confluentinc/cp-schema-registry:7.6.1
  url: "http://schema-registry:8081"
  compatibility: backward
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

# =============================================================================
# Change Data Capture — Kafka Connect + Debezium (template: kafka-connect.yaml)
# See maichess-knowledge-base/change-data-capture.md
# Postgres WAL -> user.cdc.v1 ; Mongo oplog -> match.cdc.v1
# Prereqs: Postgres wal_level=logical + slot/publication; Mongo as a replica set.
# =============================================================================
kafkaConnect:
  enabled: false
  image: quay.io/debezium/connect:2.7
  postgres:
    host: postgres
    port: 5432
    user: maichess          # the image's superuser (POSTGRES_USER) — has REPLICATION
    dbname: maichess
  mongo:
    dbname: maichess
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: "1"
      memory: 1Gi

# =============================================================================
# Elasticsearch — derived search read model (template: elasticsearch.yaml)
# See maichess-knowledge-base/search-elasticsearch.md. Single node here; scale
# the StatefulSet for a multi-node cluster in prod.
# =============================================================================
elasticsearch:
  enabled: false
  image: docker.elastic.co/elasticsearch/elasticsearch:8.14.1
  storage: 10Gi
  javaOpts: "-Xms512m -Xmx512m"
  resources:
    requests:
      cpu: 250m
      memory: 1Gi
    limits:
      cpu: "1"
      memory: 2Gi

# =============================================================================
# Databases (custom templates using official images, matching Docker Compose)
# PostgreSQL: postgres:16, MongoDB: mongo:7, Redis: redis:7-alpine
# Config is in templates/postgres.yaml, mongo.yaml, redis.yaml
# =============================================================================

# Shared Redis cache (Match Maker queue + Match Manager finished-match read
# model). All key namespaces are rebuildable/transient, so eviction runs
# allkeys-lru once maxmemory is reached. See caching-and-read-models.md.
redis:
  maxmemory: "512mb"

# =============================================================================
# Grafana (subchart)
# =============================================================================
grafana:
  fullnameOverride: grafana
  adminPassword: ""  # set via secrets values file
  rbac:
    namespaced: true
  sidecar:
    dashboards:
      enabled: true
      label: grafana_dashboard
  persistence:
    enabled: true
    size: 2Gi
  grafana.ini:
    server:
      root_url: "https://grafana.maichess.berger-software.com"
  datasources:
    datasources.yaml:
      apiVersion: 1
      datasources:
        - name: Prometheus
          type: prometheus
          uid: prometheus
          url: http://maichess-prometheus-server:80
          access: proxy
          isDefault: false
          editable: false
          jsonData:
            timeInterval: 15s
        - name: Tempo
          type: tempo
          uid: tempo
          access: proxy
          url: http://tempo:3100
          isDefault: true
          editable: true
          jsonData:
            tracesToLogsV2: {}
            serviceMap:
              datasourceUid: prometheus
            nodeGraph:
              enabled: true
            search:
              hide: false

# =============================================================================
# Tempo (subchart)
# =============================================================================
tempo:
  fullnameOverride: tempo
  tempo:
    storage:
      trace:
        backend: local
        local:
          path: /var/tempo/traces
        wal:
          path: /var/tempo/wal
    ingester:
      max_block_duration: 5m
    compactor:
      compaction:
        block_retention: 1h
    server:
      http_listen_port: 3200
    distributor:
      receivers:
        otlp:
          protocols:
            grpc:
              endpoint: "0.0.0.0:4317"
    stream_over_http_enabled: true
  persistence:
    enabled: true
    size: 5Gi

# =============================================================================
# Prometheus (subchart)
# =============================================================================
prometheus:
  fullnameOverride: prometheus
  rbac:
    create: false
  serviceAccounts:
    server:
      create: true
  server:
    # Uses in-cluster kubernetes_sd, so it needs the API. The apiserver endpoint is
    # the node's public IP, which is firewalled from the WireGuard-only worker nodes
    # (flost/mega) — pin to the API-local control-plane node.
    nodeSelector:
      node-role.kubernetes.io/control-plane: "true"
    retention: 30d
    persistentVolume:
      size: 10Gi
    extraArgs:
      web.enable-remote-write-receiver: ""
  global:
    scrape_interval: 15s
    evaluation_interval: 15s
  extraScrapeConfigs: |
    - job_name: otel-collector
      static_configs:
        - targets: ['otel-collector:8889']
    - job_name: kube-state-metrics
      static_configs:
        - targets: ['maichess-kube-state-metrics:8080']
  alertmanager:
    enabled: false
  kube-state-metrics:
    enabled: true
    # Talks to the API; pin to the control-plane node (see server.nodeSelector above).
    nodeSelector:
      node-role.kubernetes.io/control-plane: "true"
  prometheus-node-exporter:
    enabled: false
  prometheus-pushgateway:
    enabled: false

# =============================================================================
# OpenTelemetry Collector (subchart)
# =============================================================================
otelCollector:
  fullnameOverride: otel-collector
  mode: deployment
  clusterRole:
    create: false
  image:
    repository: otel/opentelemetry-collector-contrib
  config:
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: "0.0.0.0:4317"
          http:
            endpoint: "0.0.0.0:4318"
    exporters:
      otlp:
        endpoint: "tempo:4317"
        tls:
          insecure: true
      file:
        path: /var/log/otel/spans.jsonl
        rotation:
          max_megabytes: 100
          max_days: 1
          max_backups: 3
      prometheus:
        endpoint: "0.0.0.0:8889"
    connectors:
      servicegraph:
        latency_histogram_buckets: [5ms, 25ms, 100ms, 250ms, 500ms, 1s, 2s, 5s]
        store:
          ttl: 2s
          max_items: 1000
        virtual_node_peer_attributes:
          - net.peer.name
          - server.address
          - rpc.service
    processors:
      batch:
        timeout: 5s
        send_batch_size: 512
    service:
      pipelines:
        traces:
          receivers: [otlp]
          processors: [batch]
          exporters: [otlp, file, servicegraph]
        metrics/servicegraph:
          receivers: [servicegraph]
          exporters: [prometheus]
  ports:
    prometheus:
      enabled: true
      containerPort: 8889
      servicePort: 8889
      protocol: TCP
  extraVolumes:
    - name: otel-spans
      persistentVolumeClaim:
        claimName: otel-spans
  extraVolumeMounts:
    - name: otel-spans
      mountPath: /var/log/otel
