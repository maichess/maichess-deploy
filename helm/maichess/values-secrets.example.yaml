# Copy this file to the server as /etc/maichess/values-secrets-prod.yaml
# and /etc/maichess/values-secrets-staging.yaml with real values.
# DO NOT commit real secrets to git.

secrets:
  jwtSecret: "your-jwt-secret-here"
  postgresPassword: "your-postgres-password-here"
  mongoPassword: "your-mongo-password-here"
  # Only needed when kafkaConnect.enabled (Mongo replica set for CDC).
  # Generate with: openssl rand -base64 756 | tr -d '\n'
  mongoKeyfile: "your-mongo-replicaset-keyfile-here"
  redisPassword: "your-redis-password-here"
  grafanaAdminPassword: "your-grafana-password-here"
  prometheusBasicAuthUsers: "admin:$apr1$hashed-password-here"
  # Standalone tournament-server JWT signing key. Generate with: openssl rand -hex 32
  tournamentJwtSecret: "your-tournament-jwt-secret-here"
  # MinIO data-lake root credentials (only needed when minio.enabled / insights).
  minioRootUser: "maichess"
  minioRootPassword: "your-minio-root-password-here"

grafana:
  adminPassword: "your-grafana-password-here"
