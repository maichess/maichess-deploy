# Staging overrides — ephemeral storage, staging domains
global:
  environment: Staging

# Event-driven architecture: Kafka on in staging only (prod off). Events are raw
# Protobuf bytes — the Schema Registry was removed in Kafka task 09.
kafka:
  enabled: true
  ui:
    enabled: true

# Change Data Capture: Kafka Connect + Debezium on in staging only (feature-prompts/10).
# Enables Postgres wal_level=logical + the user-cdc connector and turns on the
# user-service CDC relay (Cdc__Enabled, wired in user-service.yaml).
kafkaConnect:
  enabled: true

elasticsearch:
  enabled: true

# Insights data lake + Spark execution platform on in staging only (insights
# program). MinIO + the Spark Operator (with its RBAC, PriorityClass + capped
# ResourceQuota) come up here, plus insights-db and the insights-service: the
# prerequisites now exist (database-service "insights" migration set on dev/nightly,
# maichess-insights-service:nightly image), so the full insights program runs on
# staging. insights-db reuses the nightly database-service image (has the migration).
minio:
  enabled: true
  # Staging shares maichess-mega's disk; keep the lake modest (sampled corpora).
  storage: 40Gi

sparkOperator:
  enabled: true
  spark:
    # SparkApplications run in the staging namespace.
    jobNamespaces:
      - maichess-staging

# Insights control plane: insights-db (catalog) + the Spark job image tag. The
# insights-service deployment itself is gated on services.insightsService.enabled.
insights:
  enabled: true
  sparkImageTag: nightly

ingress:
  clientDomain: staging.maichess.berger-software.com
  usersDomain: users.staging.maichess.berger-software.com
  authDomain: auth.staging.maichess.berger-software.com
  socketsDomain: sockets.staging.maichess.berger-software.com
  matchmakerDomain: matchmaker.staging.maichess.berger-software.com
  matchmanagerDomain: matchmanager.staging.maichess.berger-software.com
  analysisDomain: analysis.staging.maichess.berger-software.com
  arenaDomain: bot-arena.staging.maichess.berger-software.com
  grafanaDomain: grafana.staging.maichess.berger-software.com
  prometheusDomain: prometheus.staging.maichess.berger-software.com
  topologyApiDomain: api.topology.staging.maichess.berger-software.com
  topologyDomain: topology.staging.maichess.berger-software.com
  tournamentDomain: tournament.staging.maichess.berger-software.com
  tournamentBridgeDomain: tournament-bridge.staging.maichess.berger-software.com

certManager:
  email: tom@berger-software.com
  skipClusterIssuer: true  # already created by prod release

secrets:
  cookieDomain: staging.maichess.berger-software.com
  corsOrigin: "https://staging.maichess.berger-software.com"
  topologyWsUrl: "wss://api.topology.staging.maichess.berger-software.com/ws"

# Staging runs the `nightly` images built from each repo's `dev` branch
# (prod uses `main`). Autoscaling mirrors prod for burst-eligible services.
services:
  client:
    tag: nightly
  userService:
    tag: nightly
  authService:
    tag: nightly
    autoscaling:
      enabled: true
      minReplicas: 1
      maxReplicas: 3
      targetCPU: 70
  socketService:
    tag: nightly
  matchMakerService:
    tag: nightly
    autoscaling:
      enabled: true
      minReplicas: 1
      maxReplicas: 2
      targetCPU: 75
  matchManagerService:
    tag: nightly
  moveValidatorService:
    tag: nightly
    autoscaling:
      enabled: true
      minReplicas: 1
      maxReplicas: 3
      targetCPU: 70
  engineService:
    tag: nightly
    autoscaling:
      enabled: true
      minReplicas: 1
      maxReplicas: 3
      targetCPU: 70
  databaseService:
    tag: nightly
  topologyService:
    tag: nightly
  topologyClient:
    tag: nightly
  tournamentBridgeService:
    tag: nightly
  analysisService:
    tag: nightly
    autoscaling:
      enabled: true
      minReplicas: 1
      maxReplicas: 2
      targetCPU: 75
  botArenaService:
    tag: nightly
    autoscaling:
      enabled: true
      minReplicas: 1
      maxReplicas: 2
      targetCPU: 75
  tournamentServer:
    enabled: true
    tag: nightly
  searchService:
    enabled: true
    tag: nightly
    # Reindex is a deliberate, on-demand action — NOT every deploy. search-reindex
    # is a blocking post-upgrade hook; leaving it on makes a full Elasticsearch
    # backfill gate (and stall) every container update. Trigger a rebuild via the
    # Update Containers workflow's `reindex` input instead.
    reindex: false
  insightsService:
    enabled: true
    tag: nightly

# Note: staging database ephemeral storage not yet implemented
# (custom StatefulSets always use PVCs; for staging, delete the namespace to reset)

# Ephemeral observability
grafana:
  persistence:
    enabled: false
  grafana.ini:
    server:
      root_url: "https://grafana.staging.maichess.berger-software.com"
  datasources:
    datasources.yaml:
      apiVersion: 1
      datasources:
        - name: Prometheus
          type: prometheus
          uid: prometheus
          url: http://maichess-staging-prometheus-server:80
          access: proxy
          isDefault: false
          editable: false
          jsonData:
            timeInterval: 15s
        - name: Tempo
          type: tempo
          access: proxy
          url: http://tempo:3100
          isDefault: true
          editable: true
          jsonData:
            tracesToLogsV2: {}
            serviceMap:
              datasourceUid: prometheus
            nodeGraph:
              enabled: true
            search:
              hide: false

tempo:
  persistence:
    enabled: false

prometheus:
  server:
    persistentVolume:
      enabled: false
  extraScrapeConfigs: |
    - job_name: otel-collector
      static_configs:
        - targets: ['otel-collector:8889']
    - job_name: kube-state-metrics
      static_configs:
        - targets: ['maichess-staging-kube-state-metrics:8080']
