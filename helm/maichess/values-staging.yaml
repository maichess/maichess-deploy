# Staging overrides — ephemeral storage, staging domains
global:
  environment: Staging

ingress:
  clientDomain: staging.maichess.berger-software.com
  usersDomain: users.staging.maichess.berger-software.com
  authDomain: auth.staging.maichess.berger-software.com
  socketsDomain: sockets.staging.maichess.berger-software.com
  matchmakerDomain: matchmaker.staging.maichess.berger-software.com
  matchmanagerDomain: matchmanager.staging.maichess.berger-software.com
  analysisDomain: analysis.staging.maichess.berger-software.com
  arenaDomain: bot-arena.staging.maichess.berger-software.com
  grafanaDomain: grafana.staging.maichess.berger-software.com
  prometheusDomain: prometheus.staging.maichess.berger-software.com
  topologyApiDomain: api.topology.staging.maichess.berger-software.com
  topologyDomain: topology.staging.maichess.berger-software.com
  tournamentDomain: tournament.staging.maichess.berger-software.com
  tournamentBridgeDomain: tournament-bridge.staging.maichess.berger-software.com

certManager:
  email: tom@berger-software.com
  skipClusterIssuer: true  # already created by prod release

secrets:
  cookieDomain: staging.maichess.berger-software.com
  corsOrigin: "https://staging.maichess.berger-software.com"
  topologyWsUrl: "wss://api.topology.staging.maichess.berger-software.com/ws"

# Autoscaling — same burst-eligible services as prod
services:
  authService:
    autoscaling:
      enabled: true
      minReplicas: 1
      maxReplicas: 3
      targetCPU: 70
  engineService:
    autoscaling:
      enabled: true
      minReplicas: 1
      maxReplicas: 3
      targetCPU: 70
  moveValidatorService:
    autoscaling:
      enabled: true
      minReplicas: 1
      maxReplicas: 3
      targetCPU: 70
  analysisService:
    autoscaling:
      enabled: true
      minReplicas: 1
      maxReplicas: 2
      targetCPU: 75
  matchMakerService:
    autoscaling:
      enabled: true
      minReplicas: 1
      maxReplicas: 2
      targetCPU: 75
  botArenaService:
    autoscaling:
      enabled: true
      minReplicas: 1
      maxReplicas: 2
      targetCPU: 75
  tournamentServer:
    enabled: true
    tag: nightly

# Note: staging database ephemeral storage not yet implemented
# (custom StatefulSets always use PVCs; for staging, delete the namespace to reset)

# Ephemeral observability
grafana:
  persistence:
    enabled: false
  grafana.ini:
    server:
      root_url: "https://grafana.staging.maichess.berger-software.com"
  datasources:
    datasources.yaml:
      apiVersion: 1
      datasources:
        - name: Prometheus
          type: prometheus
          uid: prometheus
          url: http://maichess-staging-prometheus-server:80
          access: proxy
          isDefault: false
          editable: false
          jsonData:
            timeInterval: 15s
        - name: Tempo
          type: tempo
          access: proxy
          url: http://tempo:3100
          isDefault: true
          editable: true
          jsonData:
            tracesToLogsV2: {}
            serviceMap:
              datasourceUid: prometheus
            nodeGraph:
              enabled: true
            search:
              hide: false

tempo:
  persistence:
    enabled: false

prometheus:
  server:
    persistentVolume:
      enabled: false
  extraScrapeConfigs: |
    - job_name: otel-collector
      static_configs:
        - targets: ['otel-collector:8889']
    - job_name: kube-state-metrics
      static_configs:
        - targets: ['maichess-staging-kube-state-metrics:8080']
