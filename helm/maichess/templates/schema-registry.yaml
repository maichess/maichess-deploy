{{- if .Values.kafka.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: schema-registry
  labels:
    {{- include "maichess.labels" . | nindent 4 }}
    app.kubernetes.io/component: schema-registry
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: schema-registry
  template:
    metadata:
      labels:
        app.kubernetes.io/component: schema-registry
    spec:
      affinity:
        {{- include "maichess.affinityPrimary" . | nindent 8 }}
      containers:
        - name: schema-registry
          image: {{ .Values.schemaRegistry.image | default "confluentinc/cp-schema-registry:7.6.1" | quote }}
          env:
            - name: SCHEMA_REGISTRY_HOST_NAME
              value: "schema-registry"
            - name: SCHEMA_REGISTRY_LISTENERS
              value: "http://0.0.0.0:8081"
            - name: SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS
              value: "PLAINTEXT://kafka:9092"
            - name: SCHEMA_REGISTRY_SCHEMA_COMPATIBILITY_LEVEL
              value: {{ .Values.schemaRegistry.compatibility | default "backward" | quote }}
          ports:
            - containerPort: 8081
              name: http
          readinessProbe:
            httpGet:
              path: /subjects
              port: 8081
            initialDelaySeconds: 20
            periodSeconds: 10
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /subjects
              port: 8081
            initialDelaySeconds: 40
            periodSeconds: 20
            failureThreshold: 3
          resources:
            {{- toYaml (.Values.schemaRegistry.resources | default dict) | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: schema-registry
  labels:
    app.kubernetes.io/component: schema-registry
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/component: schema-registry
  ports:
    - port: 8081
      targetPort: 8081
      protocol: TCP
      name: http
{{- end }}
