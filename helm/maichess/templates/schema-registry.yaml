{{- if .Values.kafka.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: schema-registry
  labels:
    {{- include "maichess.labels" . | nindent 4 }}
    app.kubernetes.io/component: schema-registry
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: schema-registry
  template:
    metadata:
      labels:
        app.kubernetes.io/component: schema-registry
    spec:
      # Kubernetes injects legacy service-link env vars (e.g. SCHEMA_REGISTRY_PORT=
      # tcp://<clusterIP>:8081 from the same-named Service). The Confluent entrypoint
      # mistakes SCHEMA_REGISTRY_PORT for its deprecated port config and exits 1, so
      # disable service-link injection for this pod.
      enableServiceLinks: false
      affinity:
        {{- include "maichess.affinityPrimary" . | nindent 8 }}
      containers:
        - name: schema-registry
          image: {{ .Values.schemaRegistry.image | default "confluentinc/cp-schema-registry:7.6.1" | quote }}
          env:
            - name: SCHEMA_REGISTRY_HOST_NAME
              value: "schema-registry"
            - name: SCHEMA_REGISTRY_LISTENERS
              value: "http://0.0.0.0:8081"
            - name: SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS
              value: "PLAINTEXT://kafka:9092"
            - name: SCHEMA_REGISTRY_SCHEMA_COMPATIBILITY_LEVEL
              value: {{ .Values.schemaRegistry.compatibility | default "backward" | quote }}
          ports:
            - containerPort: 8081
              name: http
          # Schema Registry joins the Kafka group / elects a leader before it
          # binds :8081, which can exceed the liveness budget under load (full
          # rollout + group rebalance). The startupProbe holds liveness off until
          # the HTTP port is actually serving (up to ~5 min).
          startupProbe:
            httpGet:
              path: /subjects
              port: 8081
            periodSeconds: 10
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /subjects
              port: 8081
            initialDelaySeconds: 20
            periodSeconds: 10
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /subjects
              port: 8081
            initialDelaySeconds: 40
            periodSeconds: 20
            failureThreshold: 3
          resources:
            {{- toYaml (.Values.schemaRegistry.resources | default dict) | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: schema-registry
  labels:
    app.kubernetes.io/component: schema-registry
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/component: schema-registry
  ports:
    - port: 8081
      targetPort: 8081
      protocol: TCP
      name: http
{{- end }}
