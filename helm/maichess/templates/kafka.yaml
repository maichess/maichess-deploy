{{- if .Values.kafka.enabled }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: kafka
  labels:
    {{- include "maichess.labels" . | nindent 4 }}
    app.kubernetes.io/component: kafka
spec:
  serviceName: kafka
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: kafka
  template:
    metadata:
      labels:
        app.kubernetes.io/component: kafka
    spec:
      affinity:
        {{- include "maichess.affinityPrimary" . | nindent 8 }}
      securityContext:
        fsGroup: 1000
      containers:
        - name: kafka
          image: {{ .Values.kafka.image | default "apache/kafka:3.9.0" | quote }}
          env:
            # --- KRaft single-node (combined broker + controller, no ZooKeeper) ---
            - name: CLUSTER_ID
              value: {{ .Values.kafka.clusterId | default "MkU3OEVBNTcwNTJENDM2Qg" | quote }}
            - name: KAFKA_NODE_ID
              value: "1"
            - name: KAFKA_PROCESS_ROLES
              value: "broker,controller"
            - name: KAFKA_CONTROLLER_QUORUM_VOTERS
              # Single-node KRaft: the controller runs in this same pod, so use
              # localhost and avoid any dependence on per-pod DNS resolution
              # (kafka-0.kafka was failing with UnknownHostException at startup).
              value: "1@localhost:9093"
            - name: KAFKA_LISTENERS
              value: "PLAINTEXT://:9092,CONTROLLER://:9093"
            - name: KAFKA_ADVERTISED_LISTENERS
              value: "PLAINTEXT://kafka:9092"
            - name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP
              value: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT"
            - name: KAFKA_CONTROLLER_LISTENER_NAMES
              value: "CONTROLLER"
            - name: KAFKA_INTER_BROKER_LISTENER_NAME
              value: "PLAINTEXT"
            # --- single-broker durability settings ---
            - name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR
              value: "1"
            - name: KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR
              value: "1"
            - name: KAFKA_TRANSACTION_STATE_LOG_MIN_ISR
              value: "1"
            - name: KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS
              value: "0"
            - name: KAFKA_AUTO_CREATE_TOPICS_ENABLE
              value: "false"
            - name: KAFKA_LOG_DIRS
              value: "/var/lib/kafka/data"
          ports:
            - containerPort: 9092
              name: client
            - containerPort: 9093
              name: controller
          readinessProbe:
            tcpSocket:
              port: 9092
            initialDelaySeconds: 15
            periodSeconds: 10
            failureThreshold: 6
          livenessProbe:
            tcpSocket:
              port: 9092
            initialDelaySeconds: 30
            periodSeconds: 20
            failureThreshold: 3
          resources:
            {{- toYaml (.Values.kafka.resources | default dict) | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /var/lib/kafka/data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: {{ .Values.kafka.storage | default "8Gi" | quote }}
---
# Headless service: provides stable pod DNS (kafka-0.kafka) for the KRaft
# controller quorum and serves as the in-cluster client bootstrap address.
apiVersion: v1
kind: Service
metadata:
  name: kafka
  labels:
    app.kubernetes.io/component: kafka
spec:
  clusterIP: None
  # Publish the pod's DNS before it is Ready so kafka-0.kafka resolves during
  # startup — the KRaft controller quorum voter (1@kafka-0.kafka:9093) must
  # resolve before the broker can start and pass its readiness probe.
  publishNotReadyAddresses: true
  selector:
    app.kubernetes.io/component: kafka
  ports:
    - port: 9092
      targetPort: 9092
      protocol: TCP
      name: client
    - port: 9093
      targetPort: 9093
      protocol: TCP
      name: controller
{{- end }}
