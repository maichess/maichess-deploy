apiVersion: v1
kind: Secret
metadata:
  name: maichess-app-secrets
type: Opaque
stringData:
  jwt-secret: {{ .Values.secrets.jwtSecret | quote }}
  cookie-domain: {{ .Values.secrets.cookieDomain | quote }}
  cors-origin: {{ .Values.secrets.corsOrigin | quote }}
  topology-ws-url: {{ .Values.secrets.topologyWsUrl | quote }}
  tournament-jwt-secret: {{ .Values.secrets.tournamentJwtSecret | quote }}
  # Constructed connection strings
  postgres-connection-string: {{ printf "Host=postgres;Port=5432;Database=%s;Username=%s;Password=%s" "maichess" "maichess" .Values.secrets.postgresPassword | quote }}
  mongo-connection-string: {{ printf "mongodb://%s:%s@mongo:27017%s" "maichess" .Values.secrets.mongoPassword (ternary "/?replicaSet=rs0&authSource=admin" "" .Values.kafkaConnect.enabled) | quote }}
  redis-url: {{ printf "redis://:%s@redis:6379" .Values.secrets.redisPassword | quote }}
  redis-connection-string: {{ printf "redis:6379,password=%s" .Values.secrets.redisPassword | quote }}
---
apiVersion: v1
kind: Secret
metadata:
  name: maichess-db-secrets
type: Opaque
stringData:
  postgres-password: {{ .Values.secrets.postgresPassword | quote }}
  mongo-password: {{ .Values.secrets.mongoPassword | quote }}
  redis-password: {{ .Values.secrets.redisPassword | quote }}
  {{- if .Values.kafkaConnect.enabled }}
  # Shared internal-auth keyfile for the Mongo replica set (CDC). Same content on
  # every member; 6–1024 chars. Override in your secrets values file for prod.
  mongo-keyfile: {{ .Values.secrets.mongoKeyfile | quote }}
  {{- end }}
---
apiVersion: v1
kind: Secret
metadata:
  name: prometheus-basic-auth-secret
type: Opaque
stringData:
  users: {{ .Values.secrets.prometheusBasicAuthUsers | quote }}
