{{- if .Values.kafkaConnect.enabled }}
# Kafka Connect + Debezium — Change Data Capture for the CRUD-mastered stores.
# Postgres WAL  -> user.cdc.v1   (feeds the curated user.events.v1; see feature-prompts/10)
# Mongo  oplog  -> match.cdc.v1  (feeds the Elasticsearch indexer; see feature-prompts/13)
# Per change-data-capture.md: CDC is for CRUD master-data stores only. NEVER add a
# connector for the match.* event topics (the match aggregate is app-level event-sourced).
#
# Prerequisites (configured outside this template):
#   - Postgres: wal_level=logical, a replication slot + publication for `users`
#     (set in postgres.yaml / the user-db deploy per feature-prompts/10).
#   - Mongo: running as a replica set so an oplog exists.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kafka-connect
  labels:
    {{- include "maichess.labels" . | nindent 4 }}
    app.kubernetes.io/component: kafka-connect
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: kafka-connect
  template:
    metadata:
      labels:
        app.kubernetes.io/component: kafka-connect
    spec:
      affinity:
        {{- include "maichess.affinityPrimary" . | nindent 8 }}
      containers:
        - name: kafka-connect
          image: {{ .Values.kafkaConnect.image | default "quay.io/debezium/connect:2.7" | quote }}
          env:
            - name: BOOTSTRAP_SERVERS
              value: {{ .Values.kafka.bootstrap | default "kafka:9092" | quote }}
            - name: GROUP_ID
              value: "maichess-connect"
            - name: CONFIG_STORAGE_TOPIC
              value: "connect.configs"
            - name: OFFSET_STORAGE_TOPIC
              value: "connect.offsets"
            - name: STATUS_STORAGE_TOPIC
              value: "connect.status"
            - name: CONFIG_STORAGE_REPLICATION_FACTOR
              value: {{ .Values.kafka.replicationFactor | default 1 | quote }}
            - name: OFFSET_STORAGE_REPLICATION_FACTOR
              value: {{ .Values.kafka.replicationFactor | default 1 | quote }}
            - name: STATUS_STORAGE_REPLICATION_FACTOR
              value: {{ .Values.kafka.replicationFactor | default 1 | quote }}
            # Envelope payloads stay JSON on the *.cdc.v1 streams; the curated
            # user.events.v1 / ES indexer transform them downstream.
            - name: KEY_CONVERTER
              value: "org.apache.kafka.connect.json.JsonConverter"
            - name: VALUE_CONVERTER
              value: "org.apache.kafka.connect.json.JsonConverter"
            - name: CONNECT_REST_ADVERTISED_HOST_NAME
              value: "kafka-connect"
          ports:
            - containerPort: 8083
              name: rest
          readinessProbe:
            httpGet:
              path: /connectors
              port: 8083
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /connectors
              port: 8083
            initialDelaySeconds: 60
            periodSeconds: 20
            failureThreshold: 3
          resources:
            {{- toYaml (.Values.kafkaConnect.resources | default dict) | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: kafka-connect
  labels:
    app.kubernetes.io/component: kafka-connect
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/component: kafka-connect
  ports:
    - port: 8083
      targetPort: 8083
      protocol: TCP
      name: rest
---
# Registers/updates the Debezium connectors once Connect is up. Idempotent
# (PUT .../config). Runs on install/upgrade.
apiVersion: batch/v1
kind: Job
metadata:
  name: kafka-connect-init
  labels:
    {{- include "maichess.labels" . | nindent 4 }}
    app.kubernetes.io/component: kafka-connect-init
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "10"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: 6
  ttlSecondsAfterFinished: 600
  template:
    metadata:
      labels:
        app.kubernetes.io/component: kafka-connect-init
    spec:
      restartPolicy: OnFailure
      affinity:
        {{- include "maichess.affinityPrimary" . | nindent 8 }}
      containers:
        - name: register-connectors
          image: curlimages/curl:8.8.0
          env:
            - name: PG_USER
              value: {{ .Values.kafkaConnect.postgres.user | default "postgres" | quote }}
            - name: PG_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: maichess-db-secrets
                  key: postgres-password
            - name: MONGO_CONNECTION_STRING
              valueFrom:
                secretKeyRef:
                  name: maichess-app-secrets
                  key: mongo-connection-string
          command:
            - /bin/sh
            - -c
            - |
              set -eu
              CONNECT=http://kafka-connect:8083
              echo "Waiting for Kafka Connect REST..."
              until curl -sf "$CONNECT/connectors" >/dev/null 2>&1; do sleep 5; done

              register() {
                name="$1"; body="$2"
                echo "Registering connector $name"
                curl -sf -X PUT "$CONNECT/connectors/$name/config" \
                  -H 'Content-Type: application/json' -d "$body" >/dev/null
              }

              # Postgres WAL -> user.cdc.v1 (RegexRouter folds all user-db tables onto one topic)
              register "user-cdc" '{
                "connector.class": "io.debezium.connector.postgresql.PostgresConnector",
                "database.hostname": "{{ .Values.kafkaConnect.postgres.host | default "postgres" }}",
                "database.port": "{{ .Values.kafkaConnect.postgres.port | default 5432 }}",
                "database.user": "'"$PG_USER"'",
                "database.password": "'"$PG_PASSWORD"'",
                "database.dbname": "{{ .Values.kafkaConnect.postgres.dbname | default "maichess" }}",
                "plugin.name": "pgoutput",
                "slot.name": "maichess_user_cdc",
                "publication.name": "maichess_user_pub",
                "table.include.list": "public.users",
                "topic.prefix": "maichess_pg",
                "publication.autocreate.mode": "filtered",
                "tombstones.on.delete": "false",
                "transforms": "route",
                "transforms.route.type": "org.apache.kafka.connect.transforms.RegexRouter",
                "transforms.route.regex": ".*",
                "transforms.route.replacement": "user.cdc.v1"
              }'

              # Mongo oplog -> match.cdc.v1 (matches + analysis_games)
              register "match-cdc" '{
                "connector.class": "io.debezium.connector.mongodb.MongoDbConnector",
                "mongodb.connection.string": "'"$MONGO_CONNECTION_STRING"'",
                "topic.prefix": "maichess_mongo",
                "collection.include.list": "{{ .Values.kafkaConnect.mongo.dbname | default "maichess" }}.matches,{{ .Values.kafkaConnect.mongo.dbname | default "maichess" }}.analysis_games",
                "capture.mode": "change_streams_update_full",
                "transforms": "route",
                "transforms.route.type": "org.apache.kafka.connect.transforms.RegexRouter",
                "transforms.route.regex": ".*",
                "transforms.route.replacement": "match.cdc.v1"
              }'

              echo "Connectors registered."
              curl -s "$CONNECT/connectors"
{{- end }}
