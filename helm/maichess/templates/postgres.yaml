apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  labels:
    {{- include "maichess.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgres
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/component: postgres
    spec:
      affinity:
        {{- include "maichess.affinityPrimary" . | nindent 8 }}
      containers:
        - name: postgresql
          image: postgres:16
          {{- if .Values.kafkaConnect.enabled }}
          # Debezium CDC (change-data-capture.md) needs logical decoding. This
          # changes wal_level from the default `replica` and requires a restart
          # (StatefulSet rollout; data on the PVC is preserved). max_wal_senders /
          # max_replication_slots default to 10 in PG16 but are pinned so the
          # replication slot is guaranteed. The `maichess` superuser already has
          # the REPLICATION privilege Debezium needs.
          args:
            - "-c"
            - "wal_level=logical"
            - "-c"
            - "max_wal_senders=10"
            - "-c"
            - "max_replication_slots=10"
          {{- end }}
          env:
            - name: POSTGRES_USER
              value: "maichess"
            - name: POSTGRES_DB
              value: "maichess"
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: maichess-db-secrets
                  key: postgres-password
          ports:
            - containerPort: 5432
              name: tcp
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 10Gi
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/component: postgres
  ports:
    - port: 5432
      targetPort: 5432
      protocol: TCP
      name: tcp
