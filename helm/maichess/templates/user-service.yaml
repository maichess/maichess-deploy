{{- $extraEnv := list
  (dict "name" "ASPNETCORE_ENVIRONMENT" "value" .Values.global.environment)
  (dict "name" "Jwt__Key" "valueFrom" (dict "secretKeyRef" (dict "name" "maichess-app-secrets" "key" "jwt-secret")))
}}
{{- if .Values.kafkaConnect.enabled }}
{{/* CDC relay: curate user.events.v1 from the Debezium user.cdc.v1 stream (feature-prompts/10).
     Only enabled where Kafka Connect runs; KAFKA_BOOTSTRAP/SCHEMA_REGISTRY_URL come from kafkaEnv. */}}
{{- $extraEnv = append $extraEnv (dict "name" "Cdc__Enabled" "value" "true") }}
{{- end }}
{{- if .Values.kafka.enabled }}
{{/* Rating consumer: applies match.events.v1 MatchEnded to player stats/Glicko-2 ratings,
     replacing the retired RecordMatchResult fan-out (kafka task 08). */}}
{{- $extraEnv = append $extraEnv (dict "name" "RatingEvents__Enabled" "value" "true") }}
{{- end }}
{{ include "maichess.app.deployment" (dict
  "name" "user-service"
  "image" (printf "%s/maichess-user-service:%s" .Values.maichess.imageRegistry (.Values.services.userService.tag | default "main"))
  "ports" (list
    (dict "containerPort" 8080 "name" "http")
    (dict "containerPort" 8081 "name" "grpc")
  )
  "env" .Values.services.userService.env
  "extraEnv" $extraEnv
  "probePort" 8080
  "Release" .Release
  "Chart" .Chart
  "Values" .Values
) }}
---
{{ include "maichess.app.service" (dict
  "name" "user-service"
  "ports" (list
    (dict "port" 8080 "targetPort" 8080 "protocol" "TCP" "name" "http")
    (dict "port" 8081 "targetPort" 8081 "protocol" "TCP" "name" "grpc")
  )
) }}
