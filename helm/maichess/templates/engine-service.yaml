{{ include "maichess.app.deployment" (dict
  "name" "engine-service"
  "image" (printf "%s/maichess-engine-service:%s" .Values.maichess.imageRegistry (.Values.services.engineService.tag | default "main"))
  "ports" (list
    (dict "containerPort" 50056 "name" "grpc")
  )
  "env" .Values.services.engineService.env
  "extraEnv" (ternary (list (dict "name" "KAFKA_ENABLED" "value" "true")) (list) .Values.kafka.enabled)
  "probePort" 50056
  "resources" .Values.services.engineService.resources
  "affinity" (include "maichess.affinityBurstEligible" . | fromYaml)
  "tolerations" (list (include "maichess.tolerationBurst" . | fromYaml))
  "Release" .Release
  "Chart" .Chart
  "Values" .Values
) }}
---
{{ include "maichess.app.service" (dict
  "name" "engine-service"
  "ports" (list
    (dict "port" 50056 "targetPort" 50056 "protocol" "TCP" "name" "grpc")
  )
) }}
