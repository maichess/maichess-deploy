{{- if and .Values.kafka.enabled .Values.kafka.ui.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kafka-ui
  labels:
    {{- include "maichess.labels" . | nindent 4 }}
    app.kubernetes.io/component: kafka-ui
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: kafka-ui
  template:
    metadata:
      labels:
        app.kubernetes.io/component: kafka-ui
    spec:
      affinity:
        {{- include "maichess.affinityPrimary" . | nindent 8 }}
      containers:
        - name: kafka-ui
          image: {{ .Values.kafka.ui.image | default "provectuslabs/kafka-ui:latest" | quote }}
          env:
            - name: KAFKA_CLUSTERS_0_NAME
              value: "maichess"
            - name: KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS
              value: "kafka:9092"
            - name: KAFKA_CLUSTERS_0_SCHEMAREGISTRY
              value: "http://schema-registry:8081"
          ports:
            - containerPort: 8080
              name: http
          resources:
            {{- toYaml (.Values.kafka.ui.resources | default dict) | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: kafka-ui
  labels:
    app.kubernetes.io/component: kafka-ui
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/component: kafka-ui
  ports:
    - port: 8080
      targetPort: 8080
      protocol: TCP
      name: http
{{- end }}
