{{/*
HPA for burst-eligible services.
Only created when autoscaling.enabled is true for a service.
*/}}

{{- $services := dict
  "auth-service" .Values.services.authService
  "engine-service" .Values.services.engineService
  "move-validator-service" .Values.services.moveValidatorService
  "analysis-service" .Values.services.analysisService
  "match-maker-service" .Values.services.matchMakerService
}}

{{- range $name, $svc := $services }}
{{- if and $svc.autoscaling $svc.autoscaling.enabled }}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ $name }}
  labels:
    {{- include "maichess.labels" $ | nindent 4 }}
    app.kubernetes.io/component: {{ $name }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ $name }}
  minReplicas: {{ $svc.autoscaling.minReplicas | default 1 }}
  maxReplicas: {{ $svc.autoscaling.maxReplicas | default 3 }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ $svc.autoscaling.targetCPU | default 70 }}
{{- end }}
{{- end }}
