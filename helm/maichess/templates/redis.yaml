apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: redis
  labels:
    {{- include "maichess.labels" . | nindent 4 }}
    app.kubernetes.io/component: redis
spec:
  serviceName: redis
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: redis
  template:
    metadata:
      labels:
        app.kubernetes.io/component: redis
    spec:
      affinity:
        {{- include "maichess.affinityPrimary" . | nindent 8 }}
      containers:
        - name: redis
          image: redis:7-alpine
          command: ["redis-server"]
          # Shared Redis instance. Key namespaces:
          #   queue:* / queue_entry:* / queue_user:*  — Match Maker queue (transient; clients re-queue on miss)
          #   match:{id}                               — Match Manager finished-match doc cache (rebuildable from match-db)
          #   matches:user:{userId}:{filter}:{p}:{sz}  — Match Manager ListUserMatches page cache (rebuildable from match-db)
          # Every namespace tolerates eviction, so allkeys-lru is safe: the
          # finished-match caches repopulate from match-db on a miss (see
          # maichess-knowledge-base/caching-and-read-models.md) and queue clients
          # re-enqueue. maxmemory bounds the working set; tune per cluster.
          args:
            - "--requirepass"
            - "$(REDIS_PASSWORD)"
            - "--appendonly"
            - "yes"
            - "--maxmemory"
            - {{ .Values.redis.maxmemory | default "512mb" | quote }}
            - "--maxmemory-policy"
            - "allkeys-lru"
          env:
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: maichess-db-secrets
                  key: redis-password
          ports:
            - containerPort: 6379
              name: tcp
          volumeMounts:
            - name: data
              mountPath: /data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 2Gi
---
apiVersion: v1
kind: Service
metadata:
  name: redis
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/component: redis
  ports:
    - port: 6379
      targetPort: 6379
      protocol: TCP
      name: tcp
