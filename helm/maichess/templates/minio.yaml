{{- if .Values.minio.enabled }}
# MinIO — S3-compatible object-storage data lake for the insights program
# (knowledge/architecture/insights-and-spark.md). Holds downloaded Lichess dumps
# and manual PGN uploads (insights-raw), decompress-once scratch + partitioned
# Parquet (insights-parsed), and aggregate cache (insights-agg). Hard-pinned to
# maichess-mega (local-path PVC + the latency-sensitive datastores stay on the
# hub). Single node; not a source of truth — every Parquet set is re-derivable by
# re-ingesting the source. Staging-gated like search/anticheat.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: minio
  labels:
    {{- include "maichess.labels" . | nindent 4 }}
    app.kubernetes.io/component: minio
spec:
  serviceName: minio
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: minio
  template:
    metadata:
      labels:
        app.kubernetes.io/component: minio
    spec:
      # Hard-pin to maichess-mega — never the hub (its disks serve the live
      # datastores). MinIO disk churn stays on the compute node.
      nodeSelector:
        {{- include "maichess.nodeSelectorCompute" . | nindent 8 }}
      securityContext:
        fsGroup: 1000
      containers:
        - name: minio
          image: {{ .Values.minio.image | default "quay.io/minio/minio:RELEASE.2025-04-22T22-12-26Z" | quote }}
          args:
            - server
            - /data
            - --console-address
            - ":9001"
          env:
            - name: MINIO_ROOT_USER
              valueFrom:
                secretKeyRef:
                  name: maichess-app-secrets
                  key: minio-root-user
            - name: MINIO_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: maichess-app-secrets
                  key: minio-root-password
          ports:
            - containerPort: 9000
              name: s3
            - containerPort: 9001
              name: console
          readinessProbe:
            httpGet:
              path: /minio/health/ready
              port: 9000
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /minio/health/live
              port: 9000
            initialDelaySeconds: 30
            periodSeconds: 20
            failureThreshold: 3
          resources:
            {{- toYaml (.Values.minio.resources | default dict) | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            # Transient peak for a full Lichess month ≈ 30Gi raw + ~200Gi
            # decompress scratch (deleted after Parquet) + ~40–80Gi Parquet. Size
            # with headroom; default suits filtered/sampled corpora. See
            # knowledge/operations/spark-and-minio.md (storage sizing).
            storage: {{ .Values.minio.storage | default "100Gi" | quote }}
---
apiVersion: v1
kind: Service
metadata:
  name: minio
  labels:
    app.kubernetes.io/component: minio
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/component: minio
  ports:
    - port: 9000
      targetPort: 9000
      protocol: TCP
      name: s3
    - port: 9001
      targetPort: 9001
      protocol: TCP
      name: console
---
# Bucket bootstrap — mirrors kafka-topics-init: a post-install/upgrade hook that
# waits for MinIO, then ensures the three insights buckets exist (idempotent).
apiVersion: batch/v1
kind: Job
metadata:
  name: minio-buckets-init
  labels:
    {{- include "maichess.labels" . | nindent 4 }}
    app.kubernetes.io/component: minio-buckets-init
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "5"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: 6
  ttlSecondsAfterFinished: 600
  template:
    metadata:
      labels:
        app.kubernetes.io/component: minio-buckets-init
    spec:
      restartPolicy: OnFailure
      nodeSelector:
        {{- include "maichess.nodeSelectorCompute" . | nindent 8 }}
      containers:
        - name: create-buckets
          image: {{ .Values.minio.mcImage | default "quay.io/minio/mc:RELEASE.2025-04-16T18-13-26Z" | quote }}
          env:
            - name: MINIO_ROOT_USER
              valueFrom:
                secretKeyRef:
                  name: maichess-app-secrets
                  key: minio-root-user
            - name: MINIO_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: maichess-app-secrets
                  key: minio-root-password
          command:
            - /bin/sh
            - -c
            - |
              set -eu
              echo "Waiting for MinIO at minio:9000..."
              for i in $(seq 1 60); do
                if mc alias set lake http://minio:9000 "$MINIO_ROOT_USER" "$MINIO_ROOT_PASSWORD" >/dev/null 2>&1; then
                  echo "MinIO is up."; break
                fi
                echo "  ...not ready ($i)"; sleep 5
              done
              for bucket in insights-raw insights-parsed insights-agg; do
                echo "Ensuring bucket ${bucket}"
                mc mb --ignore-existing "lake/${bucket}"
              done
              echo "All insights buckets ensured."
              mc ls lake
{{- end }}
