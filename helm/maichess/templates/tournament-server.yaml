{{- if .Values.services.tournamentServer.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tournament-server
  labels:
    {{- include "maichess.labels" . | nindent 4 }}
    app.kubernetes.io/component: tournament-server
    maichess.io/container-update: "true"
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: tournament-server
  template:
    metadata:
      labels:
        app.kubernetes.io/component: tournament-server
        maichess.io/container-update: "true"
    spec:
      imagePullSecrets:
        - name: ghcr-pull-secret
      containers:
        - name: tournament-server
          image: {{ .Values.maichess.imageRegistry }}/tournament-server:{{ .Values.services.tournamentServer.tag | default "main" }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          env:
            - name: TOURNAMENT_JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: maichess-app-secrets
                  key: tournament-jwt-secret
          ports:
            - containerPort: 8080
              name: http
          readinessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 20
            failureThreshold: 3
      affinity:
        {{- include "maichess.affinityPrimary" . | nindent 8 }}
---
apiVersion: v1
kind: Service
metadata:
  name: tournament-server
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/component: tournament-server
  ports:
    - port: 8080
      targetPort: 8080
      protocol: TCP
      name: http
{{- end }}
