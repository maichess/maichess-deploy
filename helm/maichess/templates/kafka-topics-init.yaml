{{- if .Values.kafka.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: kafka-topics-init
  labels:
    {{- include "maichess.labels" . | nindent 4 }}
    app.kubernetes.io/component: kafka-topics-init
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "5"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: 6
  ttlSecondsAfterFinished: 600
  template:
    metadata:
      labels:
        app.kubernetes.io/component: kafka-topics-init
    spec:
      restartPolicy: OnFailure
      affinity:
        {{- include "maichess.affinityPrimary" . | nindent 8 }}
      containers:
        - name: create-topics
          image: {{ .Values.kafka.image | default "apache/kafka:3.9.0" | quote }}
          command:
            - /bin/bash
            - -c
            - |
              set -euo pipefail
              BIN=/opt/kafka/bin
              BOOTSTRAP=kafka:9092

              echo "Waiting for Kafka at ${BOOTSTRAP}..."
              for i in $(seq 1 60); do
                if "${BIN}/kafka-broker-api-versions.sh" --bootstrap-server "${BOOTSTRAP}" >/dev/null 2>&1; then
                  echo "Kafka is up."; break
                fi
                echo "  ...not ready ($i)"; sleep 5
              done

              create() {
                local name="$1" partitions="$2" retention="$3" cleanup="$4"
                echo "Creating topic ${name} (partitions=${partitions}, retention.ms=${retention}, cleanup.policy=${cleanup})"
                "${BIN}/kafka-topics.sh" --bootstrap-server "${BOOTSTRAP}" \
                  --create --if-not-exists \
                  --topic "${name}" \
                  --partitions "${partitions}" \
                  --replication-factor {{ .Values.kafka.replicationFactor | default 1 }} \
                  --config "retention.ms=${retention}" \
                  --config "cleanup.policy=${cleanup}"
              }

              {{- range .Values.kafka.topics }}
              create {{ .name | quote }} {{ .partitions | default 3 | quote }} {{ .retentionMs | default 604800000 | quote }} {{ .cleanupPolicy | default "delete" | quote }}
              {{- end }}

              echo "All topics ensured."
              "${BIN}/kafka-topics.sh" --bootstrap-server "${BOOTSTRAP}" --list
{{- end }}
